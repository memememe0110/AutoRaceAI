name: Lap Count Schema Audit
run-name: "Lap count schema audit"

on:
  push:
    branches:
      - qver-lap-count-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch immutable DB snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work
          python tools/prospective_collector.py fetch-db \
            --repo "${{ github.repository }}" \
            --branch autorace-db \
            --out work/autorace_players.sqlite3 \
            --info-out work/db_info.json

      - name: Inspect schema and direct race_key join (read-only)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path

          db = Path("work/autorace_players.sqlite3").resolve()
          info = json.loads(Path("work/db_info.json").read_text(encoding="utf-8"))
          con = sqlite3.connect(f"file:{db.as_posix()}?mode=ro", uri=True)
          con.execute("PRAGMA query_only=ON")
          tables = {r[0] for r in con.execute(
              "SELECT name FROM sqlite_master WHERE type='table'"
          )}
          print("DB_INFO", json.dumps(info, ensure_ascii=False))
          print("TABLES_PRESENT", {t: t in tables for t in ("races", "result_races")})

          for table in ("races", "result_races"):
              if table not in tables:
                  print("TABLE_MISSING", table)
                  continue
              cols = con.execute(f"PRAGMA table_info({table})").fetchall()
              names = [r[1] for r in cols]
              print(f"PRAGMA_TABLE_INFO_{table}", json.dumps(
                  [{"cid":r[0],"name":r[1],"type":r[2],"notnull":r[3],
                    "default":r[4],"pk":r[5]} for r in cols],
                  ensure_ascii=False
              ))
              print(f"ROW_COUNT_{table}", con.execute(
                  f"SELECT COUNT(*) FROM {table}"
              ).fetchone()[0])
              if "race_key" in names:
                  print(f"DISTINCT_RACE_KEY_{table}", con.execute(
                      f"SELECT COUNT(DISTINCT race_key) FROM {table}"
                  ).fetchone()[0])

          if "races" in tables and "result_races" in tables:
              rc = {r[1] for r in con.execute("PRAGMA table_info(races)")}
              rrc = {r[1] for r in con.execute("PRAGMA table_info(result_races)")}
              if "race_key" in rc and "race_key" in rrc:
                  print("DIRECT_JOIN_COUNTS", json.dumps(con.execute("""
                      SELECT
                        COUNT(*) AS joined_rows,
                        COUNT(DISTINCT rr.race_key) AS joined_distinct_result_races,
                        (SELECT COUNT(DISTINCT race_key) FROM result_races) AS result_distinct,
                        (SELECT COUNT(DISTINCT race_key) FROM races) AS races_distinct
                      FROM result_races rr
                      INNER JOIN races r ON r.race_key = rr.race_key
                  """).fetchone()))
                  # Display non-null counts and compact value distributions for likely columns.
                  candidates = {
                      "lap_count", "total_laps", "laps", "lap", "周回", "周回数",
                      "distance", "distance_m", "race_distance", "距離"
                  }
                  selected = [c for c in names if c in candidates]
                  for col in selected:
                      quoted = '"' + col.replace('"', '""') + '"'
                      rows = con.execute(
                          f"SELECT {quoted}, COUNT(*) FROM races "
                          f"GROUP BY {quoted} ORDER BY COUNT(*) DESC LIMIT 30"
                      ).fetchall()
                      print("RACES_DISTRIBUTION_" + col, json.dumps(
                          rows, ensure_ascii=False
                      ))
                  # Show result_races fields that may contain distance or lap metadata.
                  print("RESULT_RACES_METADATA_COLUMNS", [
                      c for c in sorted(rrc)
                      if any(k in c.lower() for k in ("lap","周","distance","距離"))
                  ])
          con.close()
          PY
