name: Daily Result Registration Audit
run-name: "Result audit ${{ github.event_name }}"

# Read-only audit of all registered result races from the latest immutable DB snapshot.
# No DB files are uploaded; only CSV and summary JSON are retained.
on:
  push:
    branches:
      - qver-audit-null-columns
    paths:
      - ".github/workflows/daily-result-registration-audit.yml"
  schedule:
    - cron: "0 22 * * *" # 07:00 JST every day
  workflow_dispatch:
    inputs:
      db_branch:
        description: "Source DB branch"
        required: true
        default: "autorace-db"
        type: string
      expected_generation:
        description: "Optional generation guard (blank = latest)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: daily-result-registration-audit
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout query tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve inputs
        id: params
        env:
          IN_BRANCH: ${{ inputs.db_branch }}
          IN_EXPECTED_GENERATION: ${{ inputs.expected_generation }}
        run: |
          set -euo pipefail
          branch="$IN_BRANCH"
          branch="${branch:-autorace-db}"
          expected="$IN_EXPECTED_GENERATION"
          if [ -n "$expected" ]; then
            case "$expected" in
              *[!0-9]*) echo "expected_generation must be an integer" >&2; exit 1 ;;
            esac
          fi
          echo "db_branch=$branch" >> "$GITHUB_OUTPUT"
          echo "expected_generation=$expected" >> "$GITHUB_OUTPUT"

      - name: Fetch and verify immutable DB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work
          python tools/prospective_collector.py fetch-db \
            --repo "$REPO" \
            --branch "${{ steps.params.outputs.db_branch }}" \
            --out work/autorace_players.sqlite3 \
            --info-out work/db_info.json
          df -h /home/runner

      - name: Run read-only result registration audit
        env:
          EXPECTED_GENERATION: ${{ steps.params.outputs.expected_generation }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import os
          import sqlite3
          from collections import Counter
          from pathlib import Path

          db = Path("work/autorace_players.sqlite3").resolve()
          info_path = Path("work/db_info.json")
          out = Path("work/result_audit")
          out.mkdir(parents=True, exist_ok=True)
          db_info = json.loads(info_path.read_text(encoding="utf-8"))
          generation = db_info.get("manifest_generation")
          saved_at = db_info.get("manifest_saved_at")
          expected = os.environ.get("EXPECTED_GENERATION", "").strip()
          if expected and str(generation) != expected:
              raise SystemExit(
                  f"generation mismatch: expected={expected}, actual={generation}"
              )

          required_tables = {
              "result_races", "result_entries", "result_laps", "result_payouts"
          }
          with sqlite3.connect(f"file:{db.as_posix()}?mode=ro", uri=True) as con:
              con.execute("PRAGMA query_only=ON")
              integrity = con.execute("PRAGMA integrity_check").fetchone()[0]
              if str(integrity).lower() != "ok":
                  raise SystemExit(f"integrity_check failed: {integrity}")
              tables = {
                  row[0] for row in con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }
              missing = sorted(required_tables - tables)
              if missing:
                  raise SystemExit("Missing required tables: " + ", ".join(missing))

              # Detect the optional race status column instead of silently assuming it exists.
              race_columns = {
                  row[1] for row in con.execute("PRAGMA table_info(result_races)")
              }
              lap_columns = {
                  row[1] for row in con.execute("PRAGMA table_info(result_laps)")
              }
              print("RESULT_LAPS_COLUMNS:", sorted(lap_columns))
              if "lap_label" in lap_columns:
                  goal_label_column = "lap_label"
              elif "周回" in lap_columns:
                  goal_label_column = "周回"
              else:
                  print("RESULT_LAPS_COLUMNS:", sorted(lap_columns))
                  raise SystemExit(
                      "result_laps has no supported goal-line label column "
                      "(expected lap_label or 周回)"
                  )
              # Column names are selected only from the explicit whitelist above.
              goal_line_count_sql = (
                  f"(SELECT COUNT(*) FROM result_laps l "
                  f"WHERE l.race_key = r.race_key "
                  f"AND l.{goal_label_column} = 'ゴール線') AS n_goal_lines"
              )
              has_lap_no = "lap_no" in lap_columns
              non_goal_lap_count_sql = (
                  f"(SELECT COUNT(*) FROM result_laps l "
                  f"WHERE l.race_key = r.race_key "
                  f"AND l.{goal_label_column} != 'ゴール線') AS n_non_goal_laps"
              )
              lap_no_count_sql = (
                  f"(SELECT COUNT(DISTINCT l.lap_no) FROM result_laps l "
                  f"WHERE l.race_key = r.race_key "
                  f"AND l.{goal_label_column} != 'ゴール線') AS n_lap_numbers"
                  if has_lap_no else "NULL AS n_lap_numbers"
              )
              # Count lap_no groups whose row count differs from the entry count.
              # This catches imbalances that a simple total-row modulo can miss.
              lap_no_bad_count_sql = (
                  "(SELECT COUNT(*) FROM ("
                  " SELECT l.lap_no FROM result_laps l "
                  " WHERE l.race_key = r.race_key "
                  f" AND l.{goal_label_column} != 'ゴール線' "
                  " GROUP BY l.lap_no "
                  " HAVING COUNT(*) != (SELECT COUNT(*) FROM result_entries e "
                  " WHERE e.race_key = r.race_key)"
                  ")) AS lap_no_bad_count"
                  if has_lap_no else "NULL AS lap_no_bad_count"
              )
              has_status = "status" in race_columns
              status_select = ", r.status" if has_status else ""
              raw_rows = con.execute(f"""
                  SELECT
                    r.race_key,
                    (SELECT COUNT(*) FROM result_entries e
                     WHERE e.race_key = r.race_key) AS n_entries,
                    (SELECT COUNT(*) FROM result_laps l
                     WHERE l.race_key = r.race_key) AS n_laps,
                    (SELECT COUNT(*) FROM result_payouts p
                     WHERE p.race_key = r.race_key) AS n_payouts{status_select},
                    {goal_line_count_sql},
                    {non_goal_lap_count_sql},
                    {lap_no_count_sql},
                    {lap_no_bad_count_sql}
                  FROM result_races r
                  ORDER BY r.race_key
              """).fetchall()

          # Preserve original columns; append all audit columns after them.
          base_columns = ["race_key", "n_entries", "n_laps", "n_payouts"]
          if has_status:
              base_columns.append("status")
          goal_line_index = 4 + int(has_status)
          base_columns.extend([
              "n_goal_lines", "n_non_goal_laps", "n_lap_numbers",
              "lap_no_bad_count"
          ])

          def classify_goal_lines(n_entries, n_laps, n_goal_lines,
                                  lap_no_bad_count):
              if n_entries == 0:
                  return 0, "entries_empty"
              if n_laps == 0:
                  return 1, "laps_empty"
              if n_goal_lines == 0:
                  return 1, "goal_line_shortage"
              if n_goal_lines < n_entries:
                  return 1, "goal_line_shortage"
              if n_goal_lines > n_entries:
                  return 1, "goal_line_excess"
              # Goal-line rows are expanded one row per racer. Remaining lap
              # rows should also form complete per-lap groups of n_entries.
              if (n_laps % n_entries != 0) or (lap_no_bad_count or 0) > 0:
                  return 1, "lap_shortage"
              return 0, "normal_candidate"

          goal_class_counts = Counter()
          rows = []
          goal_review_rows = []
          for raw_row in raw_rows:
              n_entries = int(raw_row[1] or 0)
              n_laps = int(raw_row[2] or 0)
              n_goal_lines = int(raw_row[goal_line_index] or 0)
              lap_no_bad_count = int(raw_row[goal_line_index + 3] or 0)
              incomplete_flag, incomplete_reason = classify_goal_lines(
                  n_entries, n_laps, n_goal_lines, lap_no_bad_count
              )
              goal_class_counts[incomplete_reason] += 1
              row = tuple(raw_row) + (incomplete_flag, incomplete_reason)
              rows.append(row)
              if incomplete_flag:
                  goal_review_rows.append(row)

          columns = base_columns + ["incomplete_flag", "incomplete_reason"]

          with (out / "result_audit_all_races.csv").open(
              "w", newline="", encoding="utf-8-sig"
          ) as f:
              writer = csv.writer(f)
              writer.writerow(columns)
              writer.writerows(rows)

          zero_rows = [
              row for row in rows
              if int(row[1] or 0) == 0
              or int(row[2] or 0) == 0
              or int(row[3] or 0) == 0
          ]
          # Put fully empty rows first, then partial-zero rows; tie-break by race_key.
          zero_rows.sort(
              key=lambda row: (
                  int(row[1] or 0) + int(row[2] or 0) + int(row[3] or 0),
                  str(row[0]),
              )
          )
          with (out / "result_audit_zero_count_review.csv").open(
              "w", newline="", encoding="utf-8-sig"
          ) as f:
              writer = csv.writer(f)
              writer.writerow(columns)
              writer.writerows(zero_rows)

          # The all-races CSV already includes the goal-line flag and reason.
          goal_columns = columns
          with (out / "result_audit_goal_line_review.csv").open(
              "w", newline="", encoding="utf-8-sig"
          ) as f:
              writer = csv.writer(f)
              writer.writerow(goal_columns)
              writer.writerows(goal_review_rows)

          # Race-level audit for missing race_time / start_time in result_entries.
          # Column presence is checked dynamically so older DB generations remain auditable.
          with sqlite3.connect(f"file:{db.as_posix()}?mode=ro", uri=True) as con:
              con.execute("PRAGMA query_only=ON")
              entry_columns = {
                  row[1] for row in con.execute("PRAGMA table_info(result_entries)")
              }
              has_race_time = "race_time" in entry_columns
              has_start_time = "start_time" in entry_columns
              race_time_expr = (
                  "SUM(CASE WHEN race_time IS NOT NULL THEN 1 ELSE 0 END)"
                  if has_race_time else "NULL"
              )
              start_time_expr = (
                  "SUM(CASE WHEN start_time IS NOT NULL THEN 1 ELSE 0 END)"
                  if has_start_time else "NULL"
              )
              time_rows = con.execute(f"""
                  SELECT race_key, COUNT(*) AS total_rows,
                         {race_time_expr} AS rows_with_race_time,
                         {start_time_expr} AS rows_with_start_time
                  FROM result_entries
                  GROUP BY race_key
                  ORDER BY race_key
              """).fetchall()

          with (out / "result_time_null_by_race.csv").open(
              "w", newline="", encoding="utf-8-sig"
          ) as f:
              writer = csv.writer(f)
              writer.writerow([
                  "race_key", "total_rows", "rows_with_race_time",
                  "rows_with_start_time"
              ])
              writer.writerows(time_rows)

          time_race_count = len(time_rows)
          time_total_rows = sum(int(r[1] or 0) for r in time_rows)
          time_rows_with_race_time = sum(int(r[2] or 0) for r in time_rows)
          time_rows_with_start_time = sum(int(r[3] or 0) for r in time_rows)
          time_audit = {
              "result_entries_race_time_column_present": has_race_time,
              "result_entries_start_time_column_present": has_start_time,
              "race_count": time_race_count,
              "races_with_any_race_time": (
                  sum(int(r[2] or 0) > 0 for r in time_rows) if has_race_time else None
              ),
              "races_without_race_time": (
                  sum(int(r[2] or 0) == 0 for r in time_rows) if has_race_time else None
              ),
              "races_with_any_start_time": (
                  sum(int(r[3] or 0) > 0 for r in time_rows) if has_start_time else None
              ),
              "races_without_start_time": (
                  sum(int(r[3] or 0) == 0 for r in time_rows) if has_start_time else None
              ),
              "total_entry_rows": time_total_rows,
              "rows_with_race_time": time_rows_with_race_time if has_race_time else None,
              "rows_without_race_time": (
                  time_total_rows - time_rows_with_race_time if has_race_time else None
              ),
              "rows_with_start_time": time_rows_with_start_time if has_start_time else None,
              "rows_without_start_time": (
                  time_total_rows - time_rows_with_start_time if has_start_time else None
              ),
          }

          summary = {
              "db_source": db_info.get("db_source"),
              "db_commit_sha": db_info.get("commit_sha"),
              "db_commit_date": db_info.get("commit_date"),
              "db_generation": generation,
              "db_manifest_saved_at": saved_at,
              "db_sha256": db_info.get("db_sha256"),
              "db_integrity_check": integrity,
              "race_count": len(rows),
              "result_laps_label_column": goal_label_column,
              "goal_line_classification_counts": dict(sorted(goal_class_counts.items())),
              "goal_line_incomplete_review_rows": len(goal_review_rows),
              "result_time_null_audit": time_audit,
              "entries_zero_count": sum(int(r[1] or 0) == 0 for r in rows),
              "laps_zero_count": sum(int(r[2] or 0) == 0 for r in rows),
              "goal_lines_zero_count": sum(int(r[goal_line_index] or 0) == 0 for r in rows),
              "payouts_zero_count": sum(int(r[3] or 0) == 0 for r in rows),
              "any_zero_count_review_rows": len(zero_rows),
              "entries_count_distribution": dict(sorted(
                  Counter(int(r[1] or 0) for r in rows).items()
              )),
              "laps_count_distribution": dict(sorted(
                  Counter(int(r[2] or 0) for r in rows).items()
              )),
              "goal_line_count_distribution": dict(sorted(
                  Counter(int(r[goal_line_index] or 0) for r in rows).items()
              )),
              "lap_no_bad_count_distribution": dict(sorted(
                  Counter(int(r[goal_line_index + 3] or 0) for r in rows).items()
              )),
              "payouts_count_distribution": dict(sorted(
                  Counter(int(r[3] or 0) for r in rows).items()
              )),
              "result_races_status_column_present": has_status,
              "result_races_status_column_name": "status" if has_status else None,
              "zero_count_status_classification": (
                  "status_included_for_manual_review"
                  if has_status else "not_performed_status_column_absent"
              ),
              "manual_status_classification_required": not has_status,
              "expected_generation_guard": expected or None,
              "database_modified": False,
              "database_in_artifact": False,
              "notes": [
                  "All result_races rows are exported; no zero-only filtering is applied to the full CSV.",
                  "Zero counts are review flags, not automatic proof of incomplete registration.",
                  "Goal-line rows are expanded one row per racer; n_goal_lines is compared with n_entries.",
                  "normal_candidate requires n_goal_lines == n_entries, n_laps divisible by n_entries, and every non-goal lap_no group to contain n_entries rows.",
                  "lap_no_bad_count detects per-lap row imbalances that a total-row modulo check alone could miss.",
                  "entries_empty and laps_empty are separate; laps_empty with entries present requires investigation and is not assumed to be a void race.",
                  "goal_line_shortage and goal_line_excess compare goal-line row count with entry count.",
                  "No fixed payout count threshold is assumed.",
                  "When result_races.status is absent, zero-count rows require manual race-status classification.",
                  "Zero-count review rows are sorted by total child-row count ascending, then race_key.",
                  "SQLite was opened with mode=ro and PRAGMA query_only=ON."
              ]
          }
          (out / "result_audit_summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False))
          PY

      - name: Run read-only NULL audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import sqlite3
          from datetime import datetime
          from pathlib import Path

          db = Path("work/autorace_players.sqlite3").resolve()
          out = Path("work/result_audit")
          out.mkdir(parents=True, exist_ok=True)
          cutoff = datetime.fromisoformat("2026-11-15T00:00:00")

          expected = {
              "result_races": [
                  "race_key", "race_date", "venue", "race_no", "registered_at",
              ],
              "result_entries": ["race_key", "race_time", "start_time"],
              "races": ["race_key"],
          }

          with sqlite3.connect(f"file:{db.as_posix()}?mode=ro", uri=True) as con:
              con.execute("PRAGMA query_only=ON")
              tables = {
                  r[0] for r in con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }
              schemas = {}
              column_rows = []
              absent = []
              for table, names in expected.items():
                  present_table = table in tables
                  info = (
                      con.execute(f'PRAGMA table_info("{table}")').fetchall()
                      if present_table else []
                  )
                  schema = {r[1]: r[2] for r in info}
                  schemas[table] = schema
                  for name in names:
                      exists = name in schema
                      if not exists:
                          absent.append(f"{table}.{name}")
                      column_rows.append([
                          table, name, schema.get(name), int(exists),
                          "present" if exists else "column_absent",
                      ])

              with (out / "null_audit_columns.csv").open(
                  "w", newline="", encoding="utf-8-sig"
              ) as f:
                  w = csv.writer(f)
                  w.writerow([
                      "table_name", "column_name", "declared_type",
                      "present", "status",
                  ])
                  w.writerows(column_rows)

              rr = schemas["result_races"]
              re = schemas["result_entries"]
              rs = schemas["races"]
              if "result_races" not in tables or "race_key" not in rr:
                  race_rows = []
                  entries_by_race = {}
                  join_keys = None
              else:
                  select_cols = [
                      name if name in rr else f"NULL AS {name}"
                      for name in (
                          "race_key", "race_date", "venue", "race_no",
                          "registered_at",
                      )
                  ]
                  race_rows = con.execute(
                      "SELECT " + ", ".join(select_cols) +
                      " FROM result_races ORDER BY race_key"
                  ).fetchall()

                  entries_by_race = {}
                  if "result_entries" in tables and "race_key" in re:
                      race_time_expr = (
                          "SUM(CASE WHEN race_time IS NULL THEN 1 ELSE 0 END)"
                          if "race_time" in re else "NULL"
                      )
                      start_time_expr = (
                          "SUM(CASE WHEN start_time IS NULL THEN 1 ELSE 0 END)"
                          if "start_time" in re else "NULL"
                      )
                      rows = con.execute(f"""
                          SELECT race_key, COUNT(*) AS total_count,
                                 {race_time_expr} AS race_time_null_count,
                                 {start_time_expr} AS start_time_null_count
                          FROM result_entries
                          GROUP BY race_key
                      """).fetchall()
                      entries_by_race = {
                          r[0]: (r[1], r[2], r[3]) for r in rows
                      }

                  join_keys = None
                  if "races" in tables and "race_key" in rs:
                      join_keys = {
                          r[0] for r in con.execute(
                              "SELECT race_key FROM races"
                          )
                      }

          def classify_race_time(null_count, registered_at):
              if null_count is None:
                  return "unknown"
              if null_count == 0:
                  return "not_applicable"
              if not registered_at:
                  return "unknown"
              try:
                  parsed = datetime.fromisoformat(str(registered_at))
              except (TypeError, ValueError):
                  return "unknown"
              # Runtime timezone is unverified. Only naive ISO timestamps
              # strictly before the conservative cutoff can be pre-fix.
              if parsed.tzinfo is not None:
                  return "unknown"
              if parsed < cutoff:
                  return "parser_bug"
              return "unknown"

          by_race = []
          for race in race_rows:
              race_key, race_date, venue, race_no, registered_at = race
              counts = entries_by_race.get(race_key)
              if counts is None:
                  race_time_null_count = None
                  start_time_null_count = None
              else:
                  _, race_time_null_count, start_time_null_count = counts

              likely_cause = classify_race_time(
                  race_time_null_count, registered_at
              )
              if join_keys is None:
                  other_missing = "unknown"
              elif race_key in join_keys:
                  other_missing = "joined"
              else:
                  other_missing = "no_join_row"

              by_race.append([
                  race_key, race_date, venue, race_no, registered_at,
                  race_time_null_count, start_time_null_count,
                  likely_cause, other_missing, "unknown",
              ])

          with (out / "null_audit_by_race.csv").open(
              "w", newline="", encoding="utf-8-sig"
          ) as f:
              w = csv.writer(f)
              w.writerow([
                  "race_key", "race_date", "venue", "race_no",
                  "registered_at", "race_time_null_count",
                  "start_time_null_count", "likely_cause",
                  "other_race_info_missing", "weather_missing",
              ])
              w.writerows(by_race)

          parser_bug_races = sum(row[7] == "parser_bug" for row in by_race)
          race_time_null_races = sum(
              row[5] is not None and row[5] > 0 for row in by_race
          )
          other_no_join = sum(row[8] == "no_join_row" for row in by_race)
          summary = {
              "race_count": len(by_race),
              "column_absent": absent,
              "column_absent_count": len(absent),
              "race_time_null_race_count": race_time_null_races,
              "parser_bug_race_count": parser_bug_races,
              "other_race_info_no_join_row_count": other_no_join,
              "other_race_info_missing_definition":
                  "結合先不在（API未提供とは限らない）",
              "weather_missing_judgment":
                  "not_implemented_no_evidence_column",
              "registered_at_timezone":
                  "naive ISO; runtime timezone unverified",
              "parser_bug_rule":
                  "race_time_null_count > 0 AND registered_at < "
                  "2026-11-15T00:00:00; naive ISO only",
              "start_time_null_count":
                  "reported for information only; not used for likely_cause",
              "database_modified": False,
              "database_in_artifact": False,
              "notes": [
                  "race_time/start_time are REAL; empty-string counts are not applicable.",
                  "start_time NULL is reported but does not independently determine likely_cause.",
                  "Timezone-ambiguous registered_at values remain unknown.",
                  "other_race_info_missing means no matching races.race_key row, not API unavailability.",
                  "weather_missing remains unknown because no evidence column is available.",
                  "SQLite opened with mode=ro and PRAGMA query_only=ON.",
              ],
          }
          (out / "null_audit_summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False))
          PY

      - name: Upload audit CSV and summary only
        uses: actions/upload-artifact@v4
        with:
          name: result-registration-audit-${{ github.run_id }}
          path: |
            work/result_audit/*.csv
            work/result_audit/*.json
          if-no-files-found: error
          retention-days: 30
