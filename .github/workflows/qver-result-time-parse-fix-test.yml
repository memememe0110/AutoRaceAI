name: QVer Result Time Parse Fix Tests

on:
  push:
    branches:
      - qver-result-time-parse-fix
    paths:
      - "engine.py"
      - "tests/test_v35_parse_entries_race_time.py"
      - ".github/workflows/qver-result-time-parse-fix-test.yml"

permissions:
  contents: read

concurrency:
  group: qver-result-time-parse-fix
  cancel-in-progress: false

jobs:
  parser-and-phase5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v4
        with:
          ref: qver-result-time-parse-fix
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas openpyxl
      - name: Compile changed Python files
        run: |
          python -m py_compile engine.py tests/test_v35_parse_entries_race_time.py
          python -m py_compile app.py tests/test_queue_done_defer.py tests/test_queue_version_lock_phase5.py tests/qver_realcode.py
      - name: Run result-time parser tests
        run: python tests/test_v35_parse_entries_race_time.py
      - name: Run Phase 5 regression tests
        run: |
          python tests/test_queue_done_defer.py
          python tests/test_queue_version_lock_phase5.py
