name: Ver330A Lap1 Validation
run-name: "Ver330A Lap1 - ${{ inputs.run_id }}"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID'
        required: true
        default: 'lap1_run1'
      db_branch:
        description: 'DB branch'
        required: true
        default: 'autorace-db'
      db_path:
        description: 'DB path'
        required: true
        default: 'autorace_players.sqlite3'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.db_branch }}
          path: db-branch
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install streamlit

      - name: Prepare DB
        run: |
          python prepare_validation_db.py \
            --db-root db-branch \
            --db-path "${{ inputs.db_path }}" \
            --output validation_workdir/autorace_players.sqlite3

      - name: Run batch
        run: |
          python run_ver330a_actions.py \
            --db validation_workdir/autorace_players.sqlite3 \
            --app app.py \
            --db-root db-branch \
            --results-rel validation/ver330a_lap1 \
            --run-id "${{ inputs.run_id }}" \
            --branch "${{ inputs.db_branch }}" \
            --max-races 100 \
            --trials 20000 \
            --seed 12345
