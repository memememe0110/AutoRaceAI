name: Ver330A Lap1 Validation
run-name: "Ver330A Lap1 - ${{ inputs.run_id }}"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID (same ID resumes completed races)'
        required: true
        default: 'lap1_run1'
        type: string
      results_branch:
        description: 'Dedicated validation output branch'
        required: true
        default: 'autorace-validation'
        type: string
      max_races:
        description: 'Races per batch (use 1 for first diagnostic, then 40)'
        required: true
        default: '1'
        type: string
      mode:
        description: 'Measurement mode'
        required: true
        default: 'Ver326'
        type: choice
        options:
          - Ver326
          - Ver330-A
      app_ref:
        description: 'App commit SHA or ref. Empty uses progress pin, else main.'
        required: false
        default: ''
        type: string
      db_tag:
        description: 'DB release tag. Empty uses progress pin, else latest db-*.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: ver330a-lap1-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout validation results
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.results_branch }}
          path: validation-output
          fetch-depth: 1

      - name: Resolve pinned app and DB
        id: pins
        env:
          APP_REF: ${{ inputs.app_ref }}
          DB_TAG: ${{ inputs.db_tag }}
          RUN_ID: ${{ inputs.run_id }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PROG="validation-output/validation/ver330a_lap1/${RUN_ID}/progress.json"
          APP="$APP_REF"
          TAG="$DB_TAG"
          if [ -f "$PROG" ]; then
            APP="$(python - "$PROG" "$APP" <<'PY'
          import json, sys
          prog, fallback = sys.argv[1], sys.argv[2]
          data = json.load(open(prog, encoding='utf-8'))
          print(data.get('app_sha256') or fallback)
          PY
          )"
            TAG="$(python - "$PROG" "$TAG" <<'PY'
          import json, sys
          prog, fallback = sys.argv[1], sys.argv[2]
          data = json.load(open(prog, encoding='utf-8'))
          print(data.get('db_tag') or fallback)
          PY
          )"
          fi
          if [ -z "$APP" ]; then APP="${{ github.event.repository.default_branch }}"; fi
          if [ -z "$TAG" ]; then
            TAG="$(gh release list --repo "$REPO" --limit 100 \
              --json tagName,publishedAt \
              --jq '[.[] | select(.tagName | startswith("db-"))] | sort_by(.publishedAt) | reverse | .[0].tagName')"
          fi
          if [ -z "$TAG" ]; then echo "::error::No db tag"; exit 1; fi
          echo "app_ref=$APP" >> "$GITHUB_OUTPUT"
          echo "db_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Pinned app=$APP db=$TAG"

      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pins.outputs.app_ref }}
          path: appsrc
          fetch-depth: 1

      - name: Record application SHA
        id: appsha
        run: |
          SHA="$(git -C appsrc rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "App SHA $SHA"

      - name: Show disk before download
        run: df -h /home/runner

      - name: Download DB from Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.pins.outputs.db_tag }}
        run: |
          set -euo pipefail
          mkdir -p validation_workdir
          gh release download "$TAG" --repo "$REPO" \
            --pattern "autorace_players.sqlite3" \
            --dir validation_workdir
          ls -lh validation_workdir/

      - name: Verify DB integrity and required tables
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          p = Path('validation_workdir/autorace_players.sqlite3')
          if not p.is_file() or p.stat().st_size < 100:
              raise SystemExit(f'DB missing or too small: {p}')
          if p.read_bytes()[:16] != b'SQLite format 3\x00':
              raise SystemExit('Not a SQLite database')
          with sqlite3.connect(f'file:{p.resolve().as_posix()}?mode=ro', uri=True) as con:
              con.execute('PRAGMA query_only=ON')
              integrity = con.execute('PRAGMA integrity_check').fetchone()[0]
              if str(integrity).lower() != 'ok':
                  raise SystemExit(f'integrity_check failed: {integrity}')
              tables = {r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              required = {'result_laps', 'v222_prediction_restore', 'v231_prediction_history'}
              missing = sorted(required - tables)
              if missing:
                  raise SystemExit('Missing required tables: ' + ', '.join(missing))
          print(f'DB ready: {p.stat().st_size:,} bytes')
          PY

      - name: Show disk after download
        run: df -h /home/runner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies (with Playwright)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas openpyxl streamlit
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run next batch (up to ${{ inputs.max_races }} races)
        env:
          RUN_ID: ${{ inputs.run_id }}
          RESULTS_BRANCH: ${{ inputs.results_branch }}
          MAX_RACES: ${{ inputs.max_races }}
          MODE: ${{ inputs.mode }}
          APP_SHA: ${{ steps.appsha.outputs.sha }}
          DB_TAG: ${{ steps.pins.outputs.db_tag }}
        run: |
          python appsrc/run_ver330a_actions.py \
            --db validation_workdir/autorace_players.sqlite3 \
            --app appsrc/app.py \
            --db-root validation-output \
            --results-rel validation/ver330a_lap1 \
            --run-id "$RUN_ID" \
            --branch "$RESULTS_BRANCH" \
            --max-races "$MAX_RACES" \
            --mode "$MODE" \
            --app-sha "$APP_SHA" \
            --db-tag "$DB_TAG" \
            --trials 20000 \
            --seed 12345 \
            --timeout 1800

      - name: Show disk after batch
        if: always()
        run: df -h /home/runner

      - name: Upload this batch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ver330a-lap1-${{ inputs.run_id }}-${{ github.run_number }}
          path: validation-output/validation/ver330a_lap1/${{ inputs.run_id }}/
          if-no-files-found: ignore
          retention-days: 30
