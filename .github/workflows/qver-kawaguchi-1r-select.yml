name: QVER Kawaguchi 1R Read-only SELECT
run-name: "QVER SELECT 20261114_川口_1R"

on:
  push:
    branches:
      - tmp-qver-kawaguchi-1r-select

permissions:
  contents: read

concurrency:
  group: qver-kawaguchi-1r-select
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout query tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch immutable DB
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p work
          python tools/prospective_collector.py fetch-db \
            --repo "$REPO" \
            --branch "autorace-db" \
            --out work/autorace_players.sqlite3 \
            --info-out work/db_info.json

      - name: Run read-only PRAGMA and SELECT checks
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import sqlite3
          from pathlib import Path

          db = Path("work/autorace_players.sqlite3").resolve()
          out = Path("work/qver_select")
          out.mkdir(parents=True, exist_ok=True)
          race_key = "20261114_川口_1R"

          def write_csv(name, header, rows):
              with (out / name).open("w", newline="", encoding="utf-8-sig") as f:
                  w = csv.writer(f)
                  w.writerow(header)
                  w.writerows(rows)

          report = {"race_key": race_key, "queries_are_read_only": True}
          with sqlite3.connect(f"file:{db.as_posix()}?mode=ro", uri=True) as con:
              con.execute("PRAGMA query_only=ON")
              report["integrity_check"] = con.execute("PRAGMA integrity_check").fetchone()[0]
              if report["integrity_check"] != "ok":
                  raise SystemExit("SQLite integrity_check failed")

              tables = {r[0] for r in con.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )}
              schemas = {}
              schema_rows = []
              for table in ("result_payouts", "result_laps", "result_races", "result_entries"):
                  if table not in tables:
                      schemas[table] = []
                      report.setdefault("missing_tables", []).append(table)
                      continue
                  info = con.execute(f'PRAGMA table_info("{table}")').fetchall()
                  schemas[table] = [r[1] for r in info]
                  schema_rows.extend([[table, *r] for r in info]
              report["schemas"] = schemas
              write_csv("schema.csv",
                        ["table_name", "cid", "name", "type", "notnull", "default", "pk"],
                        schema_rows)

              if "result_races" in tables and {"race_key", "registered_at"}.issubset(schemas["result_races"]):
                  race_rows = con.execute(
                      "SELECT race_key, typeof(registered_at), registered_at "
                      "FROM result_races WHERE race_key=?",
                      (race_key,)
                  ).fetchall()
                  report["result_races_rows"] = race_rows
                  report["result_races_count"] = len(race_rows)
                  write_csv("result_races.csv",
                            ["race_key", "registered_at_type", "registered_at"], race_rows)
              else:
                  report["result_races_rows"] = []
                  report["result_races_count"] = None

              if "result_laps" in tables:
                  lap_rows = con.execute(
                      "SELECT lap_label, COUNT(*) FROM result_laps "
                      "WHERE race_key=? GROUP BY lap_label ORDER BY lap_label",
                      (race_key,)
                  ).fetchall()
                  report["result_lap_label_counts"] = lap_rows
                  report["result_laps_count"] = sum(r[1] for r in lap_rows)
                  write_csv("result_laps.csv", ["lap_label", "count"], lap_rows)
              else:
                  report["result_lap_label_counts"] = None
                  report["result_laps_count"] = None

              if "result_entries" in tables and {"race_key", "race_time", "start_time"}.issubset(schemas["result_entries"]):
                  entry_row = con.execute(
                      "SELECT COUNT(*), SUM(race_time IS NOT NULL), "
                      "SUM(start_time IS NOT NULL) "
                      "FROM result_entries WHERE race_key=?",
                      (race_key,)
                  ).fetchone()
                  report["result_entries_count"] = entry_row[0]
                  report["race_time_nonnull"] = entry_row[1]
                  report["start_time_nonnull"] = entry_row[2]
              else:
                  report["result_entries_count"] = None
                  report["race_time_nonnull"] = None
                  report["start_time_nonnull"] = None

              if "result_payouts" in tables and {"race_key", "bet_type", "combination", "payout_yen", "popularity"}.issubset(schemas["result_payouts"]):
                  payout_rows = con.execute(
                      "SELECT bet_type, combination, payout_yen, popularity "
                      "FROM result_payouts WHERE race_key=? ORDER BY bet_type, combination",
                      (race_key,)
                  ).fetchall()
                  report["result_payouts_count"] = len(payout_rows)
                  report["payout_nonnull_counts"] = {
                      "bet_type": sum(r[0] is not None for r in payout_rows),
                      "combination": sum(r[1] is not None for r in payout_rows),
                      "payout_yen": sum(r[2] is not None for r in payout_rows),
                      "popularity": sum(r[3] is not None for r in payout_rows),
                  }
                  report["payout_rows"] = payout_rows
                  write_csv("result_payouts.csv",
                            ["bet_type", "combination", "payout_yen", "popularity"],
                            payout_rows)
              else:
                  report["result_payouts_count"] = None
                  report["payout_nonnull_counts"] = None
                  report["payout_rows"] = []

          (out / "summary.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, default=str),
              encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, default=str))
          PY

      - name: Upload SELECT results
        uses: actions/upload-artifact@v4
        with:
          name: qver-kawaguchi-1r-select-${{ github.run_id }}
          path: |
            work/qver_select/
            work/db_info.json
          if-no-files-found: error
          retention-days: 7

# Read-only re-check pinned to generation 705.
