name: QVER Lap Distribution (Read Only)
run-name: "QVER lap distribution ${{ github.ref_name }}"

on:
  push:
    branches:
      - tmp-qver-lap-distribution
    paths:
      - .github/workflows/qver-lap-distribution.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qver-lap-distribution
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout query tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and verify immutable DB
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p work
          python tools/prospective_collector.py fetch-db --repo "$REPO" --branch "autorace-db" --out work/autorace_players.sqlite3 --info-out work/db_info.json

      - name: Analyze race lap distribution (SELECT only)
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import re
          import sqlite3
          import unicodedata
          from collections import Counter, defaultdict
          from pathlib import Path

          db = Path("work/autorace_players.sqlite3").resolve()
          out = Path("work/lap_distribution")
          out.mkdir(parents=True, exist_ok=True)

          def norm(value):
              return unicodedata.normalize("NFKC", str(value or "")).strip()

          def table_columns(con, table):
              return [str(r[1]) for r in con.execute(f'PRAGMA table_info("{table}")')]

          def choose(columns, candidates):
              lower = {c.lower(): c for c in columns}
              for name in candidates:
                  if name.lower() in lower:
                      return lower[name.lower()]
              return None

          def lap_from_raw(raw):
              values = sorted({int(x) for x in re.findall(r"(\d{1,2})\s*周", norm(raw))})
              if len(values) == 1:
                  return values[0], values
              if len(values) > 1:
                  return None, values
              return None, []

          def lap_from_distance(value):
              s = norm(value).replace(",", "")
              nums = re.findall(r"\d{3,5}", s)
              if not nums:
                  return None
              # Agreed mapping for this audit: 4,100m -> 6 laps; 5,000m -> 8 laps.
              distance = int(nums[0])
              return {4100: 6, 5000: 8}.get(distance)

          def write_csv(path, header, rows):
              with path.open("w", newline="", encoding="utf-8-sig") as f:
                  w = csv.writer(f)
                  w.writerow(header)
                  w.writerows(rows)

          with sqlite3.connect(f"file:{db.as_posix()}?mode=ro", uri=True) as con:
              con.execute("PRAGMA query_only=ON")
              integrity = con.execute("PRAGMA integrity_check").fetchone()[0]
              if str(integrity).lower() != "ok":
                  raise SystemExit(f"integrity_check failed: {integrity}")

              tables = {r[0] for r in con.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'")}
              schemas = {}
              for table in ("result_races", "v15_race_inputs", "result_laps", "player_lap_history", "v15_player_history_imports"):
                  if table in tables:
                      schemas[table] = table_columns(con, table)
                  else:
                      schemas[table] = []

              if not schemas["v15_race_inputs"]:
                  raise SystemExit("v15_race_inputs table missing or has no columns")

              rr_cols = schemas["result_races"]
              v15_cols = schemas["v15_race_inputs"]
              rr_key = choose(rr_cols, ["race_key"])
              rr_distance = choose(rr_cols, ["distance", "race_distance", "kyori", "距離"])
              v15_key = choose(v15_cols, ["race_key"])
              v15_laps_col = choose(v15_cols, ["laps", "lap_count", "total_laps", "周回数"])
              v15_distance = choose(v15_cols, ["distance", "race_distance", "kyori", "距離"])
              v15_raw = choose(v15_cols, ["raw_text"])

              if not v15_key:
                  raise SystemExit(
                      "v15_race_inputs requires race_key; "
                      f"found columns={v15_cols}")
              if not any((v15_laps_col, v15_distance, v15_raw)):
                  raise SystemExit(
                      "v15_race_inputs has no laps, distance, or raw_text source; "
                      f"found columns={v15_cols}")

              distance_by_key = {}
              result_keys = set()
              result_rows = 0
              if "result_races" in tables and rr_key:
                  distance_expr = f'"{rr_distance}"' if rr_distance else "NULL"
                  sql = (f'SELECT "{rr_key}", {distance_expr} '
                         f'FROM result_races WHERE "{rr_key}" IS NOT NULL')
                  for key, distance in con.execute(sql):
                      result_rows += 1
                      k = str(key).strip()
                      if k:
                          result_keys.add(k)
                      if k and distance is not None and str(distance).strip():
                          distance_by_key.setdefault(k, set()).add(norm(distance))

              v15_laps_by_key = defaultdict(set)
              v15_distance_by_key = defaultdict(set)
              raw_by_key = defaultdict(set)
              v15_rows = 0
              select_laps = f'"{v15_laps_col}"' if v15_laps_col else "NULL"
              select_distance = f'"{v15_distance}"' if v15_distance else "NULL"
              select_raw = f'"{v15_raw}"' if v15_raw else "NULL"
              sql = (f'SELECT "{v15_key}", {select_laps}, {select_distance}, {select_raw} '
                     f'FROM v15_race_inputs WHERE "{v15_key}" IS NOT NULL')
              for key, explicit_laps, distance, raw in con.execute(sql):
                  v15_rows += 1
                  k = str(key).strip()
                  if not k:
                      continue
                  if explicit_laps is not None and str(explicit_laps).strip():
                      value = norm(explicit_laps)
                      match = re.search(r"\d{1,2}", value)
                      if match:
                          v15_laps_by_key[k].add(int(match.group(0)))
                      else:
                          v15_laps_by_key[k].add("UNPARSEABLE")
                  if distance is not None and str(distance).strip():
                      v15_distance_by_key[k].add(norm(distance))
                  if raw is not None and str(raw).strip():
                      lap, values = lap_from_raw(raw)
                      if values:
                          raw_by_key[k].update(values)
                      else:
                          raw_by_key[k].add("NO_LAP_MATCH")

          with sqlite3.connect(f"file:{db.as_posix()}?mode=ro", uri=True) as con:
              con.execute("PRAGMA query_only=ON")
              # Inventory all tables with race/lap/distance-like columns to find any
              # populated source missed by the two expected tables.
              inventory_rows = []
              for table in sorted(tables):
                  cols = table_columns(con, table)
                  relevant = [c for c in cols if any(
                      token in c.lower() for token in
                      ("race_key", "distance", "lap", "周", "raw_text", "race_name"))]
                  if relevant:
                      safe_table = table.replace('"', '""')
                      count = con.execute(f'SELECT COUNT(*) FROM "{safe_table}"').fetchone()[0]
                      inventory_rows.append([table, count, "|".join(relevant), "|".join(cols)])
    
              lap_table_summary = {}
              if "result_laps" in tables:
                  lap_cols = schemas.get("result_laps", [])
                  lap_key = choose(lap_cols, ["race_key"])
                  lap_no_col = choose(lap_cols, ["lap_no"])
                  lap_label_col = choose(lap_cols, ["lap_label"])
                  if lap_key:
                      lap_total = con.execute("SELECT COUNT(*) FROM result_laps").fetchone()[0]
                      lap_races = con.execute(
                          f'SELECT COUNT(DISTINCT "{lap_key}") FROM result_laps').fetchone()[0]
                      lap_table_summary = {
                          "rows": lap_total,
                          "distinct_races": lap_races,
                          "lap_no_column": lap_no_col,
                          "lap_label_column": lap_label_col,
                      }
                      if lap_no_col:
                          lap_table_summary["lap_no_distribution"] = [
                              list(r) for r in con.execute(
                                  f'SELECT "{lap_no_col}", COUNT(*) FROM result_laps '
                                  f'GROUP BY "{lap_no_col}" ORDER BY "{lap_no_col}"')
                          ]
                      if lap_label_col:
                          lap_table_summary["lap_label_examples"] = [
                              list(r) for r in con.execute(
                                  f'SELECT DISTINCT "{lap_label_col}" FROM result_laps '
                                  f'ORDER BY "{lap_label_col}" LIMIT 30')
                          ]
    
          # Parallel check using player_lap_history, which has race_key directly.
          player_lap_rows = []
          player_lap_summary = {"table_present": "player_lap_history" in tables}
          if "player_lap_history" in tables:
              with sqlite3.connect(f"file:{db.as_posix()}?mode=ro", uri=True) as con:
                  con.execute("PRAGMA query_only=ON")
                  plcols = table_columns(con, "player_lap_history")
                  plkey = choose(plcols, ["race_key"])
                  plno = choose(plcols, ["lap_no"])
                  plcar = choose(plcols, ["car_no"])
                  if plkey and plno:
                      sql = (
                          f'SELECT "{plkey}", MAX(CASE WHEN "{plno}" BETWEEN 1 AND 8 '
                          f'THEN "{plno}" END), COUNT(DISTINCT CASE WHEN "{plno}" BETWEEN 1 AND 8 '
                          f'THEN "{plno}" END), COUNT(DISTINCT "{plcar}") '
                          f'FROM player_lap_history GROUP BY "{plkey}" ORDER BY "{plkey}"'
                      ) if plcar else (
                          f'SELECT "{plkey}", MAX(CASE WHEN "{plno}" BETWEEN 1 AND 8 '
                          f'THEN "{plno}" END), COUNT(DISTINCT CASE WHEN "{plno}" BETWEEN 1 AND 8 '
                          f'THEN "{plno}" END), NULL FROM player_lap_history '
                          f'GROUP BY "{plkey}" ORDER BY "{plkey}"'
                      )
                      for race_key, max_lap, distinct_laps, cars in con.execute(sql):
                          if max_lap is not None:
                              player_lap_rows.append([
                                  race_key, max_lap, distinct_laps, cars,
                                  "complete" if distinct_laps == max_lap else "missing_lap_rows"
                              ])
                      player_counts = Counter(
                          "unknown" if r[1] is None else
                          "6_lap" if r[1] == 6 else
                          "8_lap" if r[1] == 8 else f"other_{r[1]}_lap"
                          for r in player_lap_rows
                      )
                      player_lap_summary = {
                          "table_present": True,
                          "rows": con.execute("SELECT COUNT(*) FROM player_lap_history").fetchone()[0],
                          "distinct_races_with_lap_no_1_to_8": len(player_lap_rows),
                          "lap_counts": dict(sorted(player_counts.items())),
                          "complete_races": sum(1 for r in player_lap_rows if r[4] == "complete"),
                          "incomplete_races": sum(1 for r in player_lap_rows if r[4] != "complete"),
                      }

          # Independent race-level distribution from imported player histories.
          history_race_rows = []
          history_summary = {"table_present": "v15_player_history_imports" in tables}
          if "v15_player_history_imports" in tables:
              with sqlite3.connect(f"file:{db.as_posix()}?mode=ro", uri=True) as con:
                  con.execute("PRAGMA query_only=ON")
                  hcols = table_columns(con, "v15_player_history_imports")
                  hdate = choose(hcols, ["race_date"])
                  hvenue = choose(hcols, ["venue"])
                  hrace = choose(hcols, ["race_no"])
                  hlaps = choose(hcols, ["laps", "lap_count", "total_laps"])
                  hdist = choose(hcols, ["distance", "distance_m", "race_distance"])
                  if all((hdate, hvenue, hrace)):
                      count_expr = f'COUNT(*)'
                      select_laps = f'GROUP_CONCAT(DISTINCT "{hlaps}")' if hlaps else "NULL"
                      select_dist = f'GROUP_CONCAT(DISTINCT "{hdist}")' if hdist else "NULL"
                      sql = (
                          f'SELECT "{hdate}", "{hvenue}", "{hrace}", {count_expr}, '
                          f'{select_laps}, {select_dist} '
                          f'FROM v15_player_history_imports '
                          f'GROUP BY "{hdate}", "{hvenue}", "{hrace}" '
                          f'ORDER BY "{hdate}", "{hvenue}", "{hrace}"'
                      )
                      for race_date, venue, race_no, player_rows, laps_text, distance_text in con.execute(sql):
                          lap_values = sorted({
                              int(x) for x in re.findall(r"\d{1,2}", norm(laps_text))
                          }) if laps_text else []
                          dist_values = sorted({
                              norm(x) for x in str(distance_text or "").split(",") if norm(x)
                          })
                          dist_laps = sorted({
                              x for x in (lap_from_distance(d) for d in dist_values) if x is not None
                          })
                          if len(lap_values) == 1:
                              lap_count, source = lap_values[0], "v15_player_history_imports.laps"
                          elif len(lap_values) > 1:
                              lap_count, source = None, "laps_conflict"
                          elif len(dist_laps) == 1:
                              lap_count, source = dist_laps[0], "v15_player_history_imports.distance"
                          elif len(dist_laps) > 1:
                              lap_count, source = None, "distance_conflict"
                          else:
                              lap_count, source = None, "unknown"
                          race_key = f"{race_date}_{venue}_{race_no}R"
                          history_race_rows.append([
                              race_key, player_rows, "|".join(map(str, lap_values)),
                              "|".join(dist_values), source,
                              lap_count if lap_count is not None else ""
                          ])
                      history_counts = Counter(
                          ("unknown" if r[5] == "" else
                           "6_lap" if r[5] == 6 else
                           "8_lap" if r[5] == 8 else f"other_{r[5]}_lap")
                          for r in history_race_rows
                      )
                      history_summary = {
                          "table_present": True,
                          "rows": con.execute("SELECT COUNT(*) FROM v15_player_history_imports").fetchone()[0],
                          "distinct_races": len(history_race_rows),
                          "race_date_column": hdate,
                          "venue_column": hvenue,
                          "race_no_column": hrace,
                          "laps_column": hlaps,
                          "distance_column": hdist,
                          "lap_counts": dict(sorted(history_counts.items())),
                      }

          # Result lap records are the strongest observed per-race source:
          # lap_no 1..N are actual laps; sentinel 99 is excluded.
          result_lap_rows = []
          result_lap_summary = {"table_present": "result_laps" in tables}
          if "result_laps" in tables:
              with sqlite3.connect(f"file:{db.as_posix()}?mode=ro", uri=True) as con:
                  con.execute("PRAGMA query_only=ON")
                  lcols = table_columns(con, "result_laps")
                  lkey = choose(lcols, ["race_key"])
                  lno = choose(lcols, ["lap_no"])
                  lcar = choose(lcols, ["car_no"])
                  if lkey and lno:
                      sql = (
                          f'SELECT "{lkey}", MAX(CASE WHEN "{lno}" BETWEEN 1 AND 8 '
                          f'THEN "{lno}" END), COUNT(DISTINCT CASE WHEN "{lno}" BETWEEN 1 AND 8 '
                          f'THEN "{lno}" END), COUNT(DISTINCT "{lcar}") '
                          f'FROM result_laps GROUP BY "{lkey}" ORDER BY "{lkey}"'
                      ) if lcar else (
                          f'SELECT "{lkey}", MAX(CASE WHEN "{lno}" BETWEEN 1 AND 8 '
                          f'THEN "{lno}" END), COUNT(DISTINCT CASE WHEN "{lno}" BETWEEN 1 AND 8 '
                          f'THEN "{lno}" END), NULL FROM result_laps GROUP BY "{lkey}" ORDER BY "{lkey}"'
                      )
                      for race_key, max_lap, distinct_laps, cars in con.execute(sql):
                          if max_lap is not None:
                              result_lap_rows.append([
                                  race_key, max_lap, distinct_laps, cars,
                                  "complete" if distinct_laps == max_lap else "missing_lap_rows"
                              ])
                      result_counts = Counter(
                          "unknown" if r[1] is None else
                          "6_lap" if r[1] == 6 else
                          "8_lap" if r[1] == 8 else f"other_{r[1]}_lap"
                          for r in result_lap_rows
                      )
                      result_lap_summary = {
                          "table_present": True,
                          "rows": con.execute("SELECT COUNT(*) FROM result_laps").fetchone()[0],
                          "distinct_races": len(result_lap_rows),
                          "lap_counts": dict(sorted(result_counts.items())),
                          "complete_races": sum(1 for r in result_lap_rows if r[4] == "complete"),
                          "incomplete_races": sum(1 for r in result_lap_rows if r[4] != "complete"),
                      }

          all_keys = sorted(result_keys | set(distance_by_key) | set(v15_laps_by_key) | set(v15_distance_by_key) | set(raw_by_key))
          details = []
          source_counts = Counter()
          lap_counts = Counter()
          mismatch_keys = []
          for key in all_keys:
              distances = sorted(distance_by_key.get(key, set()))
              distance_laps = sorted({x for x in
                  (lap_from_distance(d) for d in distances) if x is not None})
              explicit_values = v15_laps_by_key.get(key, set())
              explicit_laps = sorted(x for x in explicit_values if isinstance(x, int))
              explicit_conflict = len(explicit_laps) > 1
              v15_distances = sorted(v15_distance_by_key.get(key, set()))
              v15_distance_laps = sorted({x for x in
                  (lap_from_distance(d) for d in v15_distances) if x is not None})
              raw_values = raw_by_key.get(key, set())
              raw_laps = sorted(x for x in raw_values if isinstance(x, int))
              raw_conflict = len(raw_laps) > 1
              raw_has_no_match = "NO_LAP_MATCH" in raw_values

              if len(distance_laps) == 1:
                  laps, source = distance_laps[0], "result_races.distance"
              elif len(distance_laps) > 1:
                  laps, source = None, "distance_conflict"
              elif explicit_laps and not explicit_conflict:
                  laps, source = explicit_laps[0], "v15_race_inputs.laps"
              elif explicit_conflict:
                  laps, source = None, "v15_laps_conflict"
              elif len(v15_distance_laps) == 1:
                  laps, source = v15_distance_laps[0], "v15_race_inputs.distance"
              elif len(v15_distance_laps) > 1:
                  laps, source = None, "v15_distance_conflict"
              elif raw_laps and not raw_conflict:
                  laps, source = raw_laps[0], "v15_race_inputs.raw_text"
              elif raw_conflict:
                  laps, source = None, "raw_text_conflict"
              else:
                  laps, source = None, "unknown"

              combined_fallback_laps = set(explicit_laps) | set(v15_distance_laps) | set(raw_laps)
              if distance_laps and combined_fallback_laps and set(distance_laps).isdisjoint(combined_fallback_laps):
                  mismatch_keys.append(key)

              if laps is None:
                  category = "unknown"
              elif laps == 6:
                  category = "6_lap"
              elif laps == 8:
                  category = "8_lap"
              else:
                  category = f"other_{laps}_lap"

              source_counts[source] += 1
              lap_counts[category] += 1
              details.append([
                  key, "|".join(distances), "|".join(map(str, explicit_laps)),
                  "|".join(v15_distances), "|".join(map(str, raw_laps)),
                  source, laps if laps is not None else "", category,
                  int(raw_conflict), int(raw_has_no_match),
              ])

          known = sum(v for k, v in lap_counts.items() if k != "unknown")
          six_eight = lap_counts["6_lap"] + lap_counts["8_lap"]
          total = len(all_keys)
          summary = {
              "integrity_check": integrity,
              "tables_present": {t: t in tables for t in ("result_races", "v15_race_inputs", "result_laps", "player_lap_history", "v15_player_history_imports")},
              "result_races_columns": rr_cols,
              "v15_race_inputs_columns": v15_cols,
              "result_races_key_column": rr_key,
              "result_races_distance_column": rr_distance,
              "v15_race_key_column": v15_key,
              "v15_laps_column": v15_laps_col,
              "v15_distance_column": v15_distance,
              "v15_raw_text_column": v15_raw,
              "result_races_rows_scanned": result_rows,
              "v15_race_input_rows_scanned": v15_rows,
              "distinct_race_keys": total,
              "lap_counts": dict(sorted(lap_counts.items())),
              "source_counts": dict(sorted(source_counts.items())),
              "known_lap_count": known,
              "unknown_lap_count": lap_counts["unknown"],
              "eight_lap_share_of_known_percent": round(100 * lap_counts["8_lap"] / known, 3) if known else None,
              "eight_lap_share_of_six_or_eight_percent": round(100 * lap_counts["8_lap"] / six_eight, 3) if six_eight else None,
              "eight_lap_share_of_all_keys_percent": round(100 * lap_counts["8_lap"] / total, 3) if total else None,
              "distance_vs_raw_text_mismatch_count": len(mismatch_keys),
              "distance_vs_raw_text_mismatch_examples": mismatch_keys[:50],
              "distance_mapping": {"4100": 6, "5000": 8},
              "table_inventory": inventory_rows,
              "result_laps_summary": lap_table_summary,
              "result_laps_race_distribution": result_lap_summary,
              "player_history_race_distribution": history_summary,
              "player_lap_history_distribution": player_lap_summary,
              "classification_rule": "Precedence: recognized result_races distance, explicit v15_race_inputs.laps, recognized v15 distance, then a unique lap count in raw_text. Conflicts/unknowns are not guessed."
          }

          write_csv(out / "race_lap_distribution.csv",
                    ["race_key", "result_distance_values", "v15_laps_values",
                     "v15_distance_values", "raw_text_lap_values",
                     "classification_source", "lap_count", "category",
                     "raw_text_conflict", "raw_text_no_match"],
                    details)
          (out / "summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          write_csv(out / "table_schemas.csv", ["table", "column"],
                    [[t, c] for t, cols in schemas.items() for c in cols])
          write_csv(out / "table_inventory.csv",
                    ["table", "row_count", "relevant_columns", "all_columns"],
                    inventory_rows)
          write_csv(out / "result_laps_per_race.csv",
                    ["race_key", "max_lap_no", "distinct_lap_nos", "distinct_cars", "coverage"],
                    result_lap_rows)
          write_csv(out / "player_history_per_race.csv",
                    ["race_key", "player_history_rows", "laps_values", "distance_values", "source", "lap_count"],
                    history_race_rows)
          write_csv(out / "player_lap_history_per_race.csv",
                    ["race_key", "max_lap_no", "distinct_lap_nos", "distinct_cars", "coverage"],
                    player_lap_rows)
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload read-only results
        uses: actions/upload-artifact@v4
        with:
          name: qver-lap-distribution-${{ github.run_id }}
          path: |
            work/lap_distribution/
            work/db_info.json
          if-no-files-found: error
          retention-days: 7
