name: Brier Trial (17R, temporary revision)

# 試運転用。40R本評価時にこの4修正を正式採用するかは別判断。
on:
  push:
    branches:
      - tmp-brier-trial
    paths:
      - .github/workflows/brier-trial.yml

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trial code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trial
          fetch-depth: 1

      - name: Checkout prospective store (read-only source)
        uses: actions/checkout@v4
        with:
          ref: prospective-collect
          path: cardstore
          fetch-depth: 1

      - name: Verify input DB and schema
        working-directory: trial
        run: |
          set -euo pipefail
          DB="../cardstore/prospective/prospective_collect.sqlite3"
          test -s "$DB"

          python - "$DB" <<'PY'
          import sqlite3, sys

          db = sys.argv[1]
          con = sqlite3.connect(f"file:{db}?mode=ro", uri=True)

          required = {
              "v332_prospective_alpha_log",
              "v332_commit_log",
              "v332_prospective_results",
          }
          found = {
              r[0] for r in con.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }
          missing = sorted(required - found)

          print("DB_TABLES:", sorted(required & found))
          if missing:
              raise SystemExit(f"Missing tables: {missing}")

          print("DB_READ_ONLY_SCHEMA_CHECK: PASS")
          con.close()
          PY

      - name: Audit Kawaguchi 1R car-set provenance
        working-directory: trial
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3, json, re

          db = "../cardstore/prospective/prospective_collect.sqlite3"
          con = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
          con.execute("PRAGMA query_only=ON")
          con.row_factory = sqlite3.Row

          row = con.execute("""
              SELECT car_set_json, lap_order_counts_json
              FROM v332_prospective_alpha_log
              WHERE race_key='20261115_川口_1R'
                AND config_id='ver326_1_base'
          """).fetchone()

          if row is None:
              print("ALPHA_ROW: NOT_FOUND")
          else:
              print("CAR_SET_JSON:", row["car_set_json"])
              counts = json.loads(row["lap_order_counts_json"] or "{}")
              lap1_counts = counts.get("1") or {}
              keys = list(lap1_counts.keys())
              print("COUNTS_LAP1_KEYS:", keys[:20])
              print("COUNTS_LAP1_COUNT:", len(keys))
              car_sets = {
                  frozenset(int(x) for x in str(k).split("-"))
                  for k in keys
              }
              print("DISTINCT_CAR_SETS_IN_COUNTS:",
                    [sorted(s) for s in sorted(car_sets, key=lambda x: (len(x), sorted(x)))])
          
          cols = [r["name"] for r in con.execute(
              "PRAGMA table_info(v332_prospective_results)"
          )]
          print("RESULTS_COLUMNS:", cols)
          relevant = [
              c for c in cols
              if re.search(r"absent|accident|欠車|事故|car|車番|entry|result", c, re.I)
          ]
          print("RESULTS_RELEVANT_COLUMNS:", relevant)

          result_rows = con.execute("""
              SELECT * FROM v332_prospective_results
              WHERE race_key='20261115_川口_1R'
          """).fetchall()
          print("RESULT_ROW_COUNT:", len(result_rows))
          for i, rr in enumerate(result_rows):
              d = dict(rr)
              print(f"RESULT_ROW_{i}_KEYS:", list(d.keys()))
              print(f"RESULT_ROW_{i}_RELEVANT:", {
                  k: d.get(k) for k in relevant
              })
              print(f"RESULT_ROW_{i}_JSON_FIELDS:", {
                  k: v for k, v in d.items()
                  if isinstance(v, str) and v.strip().startswith(("{", "["))
              })

          con.close()
          PY

      - name: Audit Kawaguchi 1R raw input provenance (read-only)
        working-directory: trial
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import sqlite3, json, re
          from pathlib import Path

          db = "../cardstore/prospective/prospective_collect.sqlite3"
          con = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
          con.execute("PRAGMA query_only=ON")
          con.row_factory = sqlite3.Row
          row = con.execute("""
              SELECT raw_text, input_builder_manifest_json, car_set_json,
                     lap_order_counts_json
              FROM v332_prospective_alpha_log
              WHERE race_key='20261115_川口_1R'
                AND config_id='ver326_1_base'
          """).fetchone()
          if row is None:
              raise SystemExit("TARGET_ROW_NOT_FOUND")

          raw_text = row["raw_text"] or ""
          manifest_raw = row["input_builder_manifest_json"] or ""
          manifest = json.loads(manifest_raw) if manifest_raw else None
          car_set = json.loads(row["car_set_json"] or "null")
          counts = json.loads(row["lap_order_counts_json"] or "{}")
          lap1 = counts.get("1") or {}
          keys = list(lap1.keys())

          lines = raw_text.splitlines()
          target = None
          for i, line in enumerate(lines):
              if re.match(r"^\\s*3(?:[\\t 　]+)\\S", line):
                  target = i
                  break
          if target is None:
              m = re.search(r"(?<!\\d)3(?=[\\t 　])", raw_text)
              pos = m.start() if m else -1
          else:
              pos = sum(len(x) + 1 for x in lines[:target])
          snippet = raw_text[max(0, pos-100):pos+300] if pos >= 0 else "CAR_3_BLOCK_NOT_FOUND"

          print("RAW_TEXT_CAR3_SNIPPET:", json.dumps(snippet, ensure_ascii=False))
          print("INPUT_BUILDER_MANIFEST_JSON:", json.dumps(manifest, ensure_ascii=False, sort_keys=True))
          print("CAR_SET_JSON:", json.dumps(car_set, ensure_ascii=False))
          print("COUNTS_LAP1_KEYS_FIRST5:", json.dumps(keys[:5], ensure_ascii=False))
          print("COUNTS_LAP1_KEY_COUNT:", len(keys))

          audit = {
              "race_key": "20261115_川口_1R",
              "config_id": "ver326_1_base",
              "raw_text": raw_text,
              "input_builder_manifest_json_raw": manifest_raw,
              "input_builder_manifest": manifest,
              "car_set_json": car_set,
              "lap_order_counts_json_lap1": lap1,
              "lap1_keys_first5": keys[:5],
          }
          Path("output/kawaguchi1r_input_audit.json").write_text(
              json.dumps(audit, ensure_ascii=False, indent=2), encoding="utf-8")
          con.close()
          PY

      - name: Recheck parser and duplicate provenance (read-only)
        working-directory: trial
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q numpy pandas openpyxl
          python - <<'PY'
          import sqlite3, json, sys
          from pathlib import Path

          db = "../cardstore/prospective/prospective_collect.sqlite3"
          con = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
          con.execute("PRAGMA query_only=ON")
          con.row_factory = sqlite3.Row

          cols = [r["name"] for r in con.execute(
              "PRAGMA table_info(v332_prospective_alpha_log)"
          )]
          wanted = ["id", "created_at", "status", "race_key", "config_id"]
          selected = [c for c in wanted if c in cols]
          print("ALPHA_LOG_COLUMNS:", cols)
          sql = "SELECT " + ", ".join('"' + c + '"' for c in selected) + """
            FROM v332_prospective_alpha_log
            WHERE race_key=? AND config_id=?
            ORDER BY id
          """
          rows = [dict(r) for r in con.execute(
              sql, ("20261115_川口_1R", "ver326_1_base")
          )]
          print("TARGET_DUPLICATE_ROW_COUNT:", len(rows))
          print("TARGET_DUPLICATE_ROWS:", json.dumps(rows, ensure_ascii=False))

          raw_row = con.execute("""
              SELECT raw_text FROM v332_prospective_alpha_log
              WHERE race_key=? AND config_id=?
              ORDER BY id DESC LIMIT 1
          """, ("20261115_川口_1R", "ver326_1_base")).fetchone()
          raw_text = raw_row["raw_text"] if raw_row else ""
          sys.path.insert(0, str(Path.cwd()))
          import engine
          parsed = engine.v15_parse_entries(raw_text)
          print("CURRENT_ENGINE_V15_PARSE_CARS:",
                sorted(int(x) for x in parsed["車番"].tolist()))
          print("CURRENT_ENGINE_V15_PARSE_COUNT:", len(parsed))
          con.close()
          PY


      - name: Extract prediction-path AST (read-only)
        working-directory: trial
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, re
          from pathlib import Path

          src = Path("app.py").read_text(encoding="utf-8")
          tree = ast.parse(src)
          lines = src.splitlines()
          defs = {}
          parents = {}
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  defs[node.name] = node
          for parent in ast.walk(tree):
              for child in ast.iter_child_nodes(parent):
                  parents[child] = parent

          def segment(node):
              return ast.get_source_segment(src, node) or ""

          def calls_in(node):
              return sorted({n.func.id if isinstance(n.func, ast.Name)
                             else n.func.attr if isinstance(n.func, ast.Attribute) else ""
                             for n in ast.walk(node) if isinstance(n, ast.Call)} - {""})

          def owner_function(node):
              cur = node
              while cur in parents:
                  cur = parents[cur]
                  if isinstance(cur, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      return cur
              return None

          out = []
          out.append(f"APP_SHA256_INPUT_BYTES={len(src.encode('utf-8'))}")
          out.append(f"TOP_LEVEL_FUNCTIONS={len(defs)}")

          target = defs.get("_v319_run_prerace_prediction")
          if target is None:
              out.append("TARGET_FUNCTION_NOT_FOUND")
          else:
              out.append("\n===== TARGET _v319_run_prerace_prediction =====")
              out.append(f"LINES={target.lineno}-{target.end_lineno}")
              out.append(segment(target))
              calls = calls_in(target)
              out.append("\nTARGET_CALLS=" + ", ".join(calls))
              # Include directly called local helpers that look relevant to parsing/dataframe/simulation.
              relevant = [n for n in calls if n in defs and re.search(
                  r"parse|entry|sim|predict|array|card|race", n, re.I)]
              for name in relevant:
                  node = defs[name]
                  out.append(f"\n===== DIRECT HELPER {name} LINES={node.lineno}-{node.end_lineno} =====")
                  out.append(segment(node))

          out.append("\n===== COMPARE ENV BRANCHES =====")
          compare_nodes = []
          for node in ast.walk(tree):
              if isinstance(node, (ast.If, ast.IfExp)):
                  test = ast.unparse(node.test)
                  if "AUTORACE_COMPARE" in test or "AUTORACE_VER330A_COMPARE" in test:
                      compare_nodes.append(node)
          for node in sorted(compare_nodes, key=lambda n:n.lineno):
              out.append(f"\n--- IF LINES={node.lineno}-{node.end_lineno} TEST={ast.unparse(node.test)} ---")
              out.append(segment(node))

          out.append("\n===== PARSER / SIMULATION CALL SITES =====")
          seen = set()
          for node in ast.walk(tree):
              if not isinstance(node, ast.Call):
                  continue
              fn = node.func
              name = fn.id if isinstance(fn, ast.Name) else fn.attr if isinstance(fn, ast.Attribute) else ""
              if re.search(r"parse_entries|detect_nonstarters|prepare_simulation_arrays|simulate", name, re.I):
                  owner = owner_function(node)
                  key = (name, node.lineno, owner.name if owner else "<module>")
                  if key in seen: continue
                  seen.add(key)
                  out.append(f"CALL {name} LINE={node.lineno} OWNER={owner.name if owner else '<module>'} OWNER_LINES={owner.lineno if owner else '?'}-{owner.end_lineno if owner else '?'}")
                  if owner and owner.name not in ("_v319_run_prerace_prediction",):
                      # Emit only concise surrounding source context for non-target call sites.
                      lo=max(owner.lineno, node.lineno-7); hi=min(owner.end_lineno, node.lineno+7)
                      out.extend(f"{i}: {lines[i-1]}" for i in range(lo,hi+1))

          Path("output").mkdir(exist_ok=True)
          Path("output/app_prediction_ast_audit.txt").write_text("\n".join(out), encoding="utf-8")
          print("\n".join(out))
          PY


      - name: Test exact app nonstarter detector against saved raw text (read-only)
        working-directory: trial
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, re, sqlite3, sys
          from pathlib import Path

          db = "../cardstore/prospective/prospective_collect.sqlite3"
          con = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
          con.execute("PRAGMA query_only=ON")
          row = con.execute("""
              SELECT raw_text FROM v332_prospective_alpha_log
              WHERE race_key=? AND config_id=?
              ORDER BY id DESC LIMIT 1
          """, ("20261115_川口_1R", "ver326_1_base")).fetchone()
          if row is None:
              raise SystemExit("TARGET_RAW_TEXT_NOT_FOUND")
          raw = row[0] or ""
          con.close()

          src = Path("app.py").read_text(encoding="utf-8")
          tree = ast.parse(src)
          fn = None
          for node in tree.body:
              if isinstance(node, ast.FunctionDef) and node.name == "_v319_detect_kessha_from_card_text":
                  fn = node
          if fn is None:
              raise SystemExit("APP_DETECTOR_NOT_FOUND")
          mod = ast.Module(body=[fn], type_ignores=[])
          ns = {"re": re}
          exec(compile(mod, "app_detector_extract", "exec"), ns)
          detected = ns["_v319_detect_kessha_from_card_text"](raw)

          sys.path.insert(0, str(Path.cwd()))
          import engine
          parsed_auto = engine.v15_parse_entries(raw)
          parsed_empty_override = engine.v15_parse_entries(raw, manual_excluded=[])
          parsed_app_excl = engine.v15_parse_entries(raw, manual_excluded=detected)

          print("APP_DETECTOR_KESSHA:", detected)
          print("ENGINE_V15_NO_OVERRIDE_CARS:", sorted(int(x) for x in parsed_auto["車番"].tolist()))
          print("ENGINE_V15_EMPTY_OVERRIDE_CARS:", sorted(int(x) for x in parsed_empty_override["車番"].tolist()))
          print("ENGINE_V15_APP_DETECTOR_OVERRIDE_CARS:", sorted(int(x) for x in parsed_app_excl["車番"].tolist()))
          print("ENGINE_V15_EMPTY_OVERRIDE_COUNT:", len(parsed_empty_override))
          print("ENGINE_V15_APP_DETECTOR_OVERRIDE_COUNT:", len(parsed_app_excl))
          PY


      - name: Trace compare-mode owner and simulation call graph (read-only)
        working-directory: trial
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, re
          from pathlib import Path

          src = Path("app.py").read_text(encoding="utf-8")
          tree = ast.parse(src)
          lines = src.splitlines()
          parents = {}
          defs = {}
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  defs[node.name] = node
          for parent in ast.walk(tree):
              for child in ast.iter_child_nodes(parent):
                  parents[child] = parent

          def owner(node):
              cur=node
              while cur in parents:
                  cur=parents[cur]
                  if isinstance(cur,(ast.FunctionDef,ast.AsyncFunctionDef)):
                      return cur
              return None

          def calls(node):
              return sorted({n.func.id if isinstance(n.func,ast.Name)
                             else n.func.attr if isinstance(n.func,ast.Attribute) else ""
                             for n in ast.walk(node) if isinstance(n,ast.Call)}- {""})

          def emit_node(label,node):
              print(f"\n===== {label} LINES={node.lineno}-{node.end_lineno} =====")
              print(ast.get_source_segment(src,node) or "")

          print("===== COMPARE ENV IF OWNERS =====")
          for node in ast.walk(tree):
              if isinstance(node,ast.If):
                  test=ast.unparse(node.test)
                  if "AUTORACE_COMPARE" in test or "AUTORACE_VER330A_COMPARE" in test:
                      own=owner(node)
                      print(f"IF line={node.lineno}-{node.end_lineno} owner={own.name if own else '<module>'} owner_lines={own.lineno if own else '?'}-{own.end_lineno if own else '?'} test={test}")
                      emit_node("COMPARE_IF",node)

          print("\n===== COMPARE / VALIDATION FUNCTIONS =====")
          for name,node in sorted(defs.items(),key=lambda x:x[1].lineno):
              if re.search(r"compare|validation",name,re.I):
                  cs=calls(node)
                  if any(re.search(r"prerace|run_prediction|simulate|lap_order|counts|prepare",x,re.I) for x in cs) or re.search(r"compare",name,re.I):
                      print(f"FUNC {name} LINES={node.lineno}-{node.end_lineno} CALLS={cs}")
                      if re.search(r"compare|validation",name,re.I):
                          emit_node(name,node)

          print("\n===== FUNCTIONS TOUCHING LAP COUNTS / OUTPUT =====")
          for name,node in sorted(defs.items(),key=lambda x:x[1].lineno):
              seg=ast.get_source_segment(src,node) or ""
              if any(k in seg for k in ("lap_order_counts","AUTORACE_COMPARE_OUT","_v319_run_prerace_prediction","ver16_run_prediction")):
                  print(f"FUNC {name} LINES={node.lineno}-{node.end_lineno} CALLS={calls(node)}")
                  # Only print functions that write compare output or invoke prediction/simulation.
                  if any(k in seg for k in ("AUTORACE_COMPARE_OUT","_v319_run_prerace_prediction","ver16_run_prediction")):
                      emit_node(name,node)

          print("\n===== MODULE-LEVEL COMPARE INVOCATIONS =====")
          for node in tree.body:
              if isinstance(node,ast.Expr) or isinstance(node,ast.If):
                  seg=ast.get_source_segment(src,node) or ""
                  if "AUTORACE_VER330A_COMPARE" in seg or "AUTORACE_COMPARE_OUT" in seg:
                      emit_node("MODULE_COMPARE",node)
          PY

      - name: Audit restored v222 prediction text detector (read-only)
        working-directory: trial
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, re, sqlite3
          from pathlib import Path

          db = "../cardstore/prospective/prospective_collect.sqlite3"
          con = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
          con.execute("PRAGMA query_only=ON")
          con.row_factory = sqlite3.Row

          tables = {
              r["name"] for r in con.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }
          if "v222_prediction_restore" not in tables:
              print("RESTORE_ROW_FOUND: False")
              print("RESTORE_DETECTOR_KESSHA: NOT_RUN_TABLE_MISSING")
              print("RESTORE_TEXT_LEN: 0")
              con.close()
              raise SystemExit(0)

          row = con.execute("""
              SELECT raw_text
              FROM v222_prediction_restore
              WHERE race_key=?
          """, ("20261115_川口_1R",)).fetchone()

          found = row is not None
          prediction_text = (row["raw_text"] or "") if found else ""
          print("RESTORE_ROW_FOUND:", found)
          print("RESTORE_TEXT_LEN:", len(prediction_text))

          if not found:
              print("RESTORE_DETECTOR_KESSHA: NOT_RUN_ROW_MISSING")
              con.close()
              raise SystemExit(0)

          src = Path("app.py").read_text(encoding="utf-8")
          tree = ast.parse(src)
          fn = next(
              (node for node in tree.body
               if isinstance(node, ast.FunctionDef)
               and node.name == "_v319_detect_kessha_from_card_text"),
              None,
          )
          if fn is None:
              print("RESTORE_DETECTOR_KESSHA: ERROR_DETECTOR_NOT_FOUND")
              con.close()
              raise SystemExit(0)

          ns = {"re": re}
          exec(compile(ast.Module(body=[fn], type_ignores=[]),
                       "app_detector_extract", "exec"), ns)
          try:
              detected = ns["_v319_detect_kessha_from_card_text"](prediction_text)
              print("RESTORE_DETECTOR_KESSHA:", detected)
          except Exception as exc:
              print("RESTORE_DETECTOR_KESSHA: ERROR", type(exc).__name__, str(exc))

          con.close()
          PY

      - name: Isolated compare-mode Kawaguchi 1R regression test
        working-directory: trial
        env:
          AUTORACE_VER330A_COMPARE: "1"
          AUTORACE_COMPARE_OUT: ${{ github.workspace }}/trial/output/kawaguchi1r_compare.json
          AUTORACE_COMPARE_MODE: "Ver326"
          AUTORACE_COMPARE_DB: ${{ github.workspace }}/trial/output/compare_snapshot.sqlite3
          AUTORACE_COMPARE_RACE_KEY: "20261115_川口_1R"
          AUTORACE_COMPARE_TRIALS: "8000"
          AUTORACE_COMPARE_SEED: "12345"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          mkdir -p output
          python - <<'PY'
          import json, shutil, sqlite3
          from pathlib import Path
          source = Path("../cardstore/prospective/prospective_collect.sqlite3")
          target = Path("output/compare_snapshot.sqlite3")
          shutil.copy2(source, target)
          con = sqlite3.connect(target)
          row = con.execute("""
              SELECT raw_text FROM v332_prospective_alpha_log
              WHERE race_key=? AND config_id=?
              ORDER BY id DESC LIMIT 1
          """, ("20261115_川口_1R", "ver326_1_base")).fetchone()
          if not row or not row[0]:
              raise SystemExit("TARGET_RAW_TEXT_NOT_FOUND")
          con.execute("DROP TABLE IF EXISTS v222_prediction_restore")
          con.execute("""
              CREATE TABLE v222_prediction_restore (
                  race_key TEXT PRIMARY KEY,
                  raw_text TEXT,
                  venue_override TEXT
              )
          """)
          con.execute(
              "INSERT INTO v222_prediction_restore(race_key,raw_text,venue_override) VALUES(?,?,?)",
              ("20261115_川口_1R", row[0], "川口"),
          )
          con.execute("""
              CREATE TABLE IF NOT EXISTS v15_player_history_imports (
                  player_name TEXT, race_date TEXT, race_no INTEGER, venue TEXT,
                  rank INTEGER, starters INTEGER, surface TEXT, handicap REAL,
                  track_temp REAL, humidity REAL, race_type TEXT,
                  trial_time REAL, race_time REAL, st REAL, raw_line TEXT
              )
          """)
          con.commit()
          con.close()
          print("COMPARE_SNAPSHOT_READY: race_key=20261115_川口_1R raw_text_len=" + str(len(row[0])))
          print("COMPARE_SNAPSHOT_SUPPORT: empty v15_player_history_imports table for isolated car-count test")
          PY
          (streamlit run app.py --server.headless=true --server.port=8501 > output/streamlit_compare.log 2>&1 & echo $! > output/streamlit.pid)
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out = Path("output/kawaguchi1r_compare.json")
          ready = False
          for _ in range(90):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=2).read()
                  ready = True
                  break
              except Exception:
                  time.sleep(1)
          if not ready:
              raise SystemExit("STREAMLIT_SERVER_NOT_READY")
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto("http://127.0.0.1:8501", wait_until="domcontentloaded", timeout=60000)
              for _ in range(180):
                  if out.exists() and out.stat().st_size:
                      break
                  time.sleep(1)
              browser.close()
          if not out.exists():
              raise SystemExit("COMPARE_OUTPUT_NOT_CREATED")
          result = json.loads(out.read_text(encoding="utf-8"))
          print("KAWAGUCHI1R_COMPARE_RESULT:", json.dumps(result, ensure_ascii=False, sort_keys=True))
          if not result.get("ok"):
              raise SystemExit("COMPARE_MODE_FAILED: " + str(result.get("error")))
          PY

      - name: Run 17R Brier trial
        working-directory: trial
        run: |
          set -euo pipefail
          mkdir -p output

          python - <<'PY'
          import sys
          import json

          sys.path.insert(0, "tools")
          import evaluate_brier as eb

          result = eb.evaluate(
              "../cardstore/prospective/prospective_collect.sqlite3",
              "ver326_1_base",
              "2026-11-14",
              "2026-11-15",
              n_boot=0,
          )

          with open("output/brier_trial.json", "w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2,
                  default=str,
              )

          print(json.dumps(result, ensure_ascii=False, indent=2, default=str))
          PY

      - name: Upload trial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brier-trial-17r-${{ github.run_id }}
          path: trial/output/
          if-no-files-found: warn
          retention-days: 30
