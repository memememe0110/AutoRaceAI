name: Fix and test result lap labels

on:
  push:
    branches:
      - qver-laps-label-fix
    paths:
      - ".github/workflows/qver-laps-label-fix.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: qver-laps-label-fix
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: qver-laps-label-fix

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pandas pytest

      - name: Download captured API diagnostic and create fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/laps-fixture
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14162431910/zip" \
            -o /tmp/laps-fixture/diagnostic.zip
          python - <<'PY'
          import json, re, zipfile
          from pathlib import Path
          z = zipfile.ZipFile("/tmp/laps-fixture/diagnostic.zip")
          names = [n for n in z.namelist() if n.endswith("laps_label_diagnostic.log")]
          if len(names) != 1:
              raise SystemExit(f"Expected one diagnostic log, got {names}")
          log = z.read(names[0]).decode("utf-8")
          payloads = re.findall(r"^GRAND_NOTE_ALL: (.+)$", log, re.M)
          expected = ["hamamatsu_10r", "hamamatsu_12r_void", "kawaguchi_1r", "sanyo_8r"]
          if len(payloads) != 4:
              raise SystemExit(f"Expected four captured API grandNoteList payloads, got {len(payloads)}")
          fixtures = [{"name": n, "grandNoteList": json.loads(p)} for n, p in zip(expected, payloads)]
          out = Path("tests/fixtures/laps_label_cases.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(fixtures, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("FIXTURES_CREATED:", out, "cases=", len(fixtures))
          PY

      - name: Patch converter and parser
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("app.py")
          app = app_path.read_text(encoding="utf-8")
          start = app.index("    # 周回（grandNoteList）")
          end = app.index("    # 払戻", start)
          new_block = '''    # 周回（grandNoteList）
              gn = body.get("grandNoteList") or []
              if gn:
                  def _valid_lap_car(value):
                      car = str(value or "").strip()
                      return car in ("1", "2", "3", "4", "5", "6", "7", "8")

                  valid_lap_nos = []
                  for item in gn:
                      if not isinstance(item, dict):
                          continue
                      try:
                          lap_no = int(item.get("lapNo"))
                      except (TypeError, ValueError):
                          continue
                      ranks = item.get("rankList") or []
                      if any(
                          isinstance(r, dict) and _valid_lap_car(r.get("carNo"))
                          for r in ranks
                      ):
                          valid_lap_nos.append(lap_no)
                  max_lap = max(valid_lap_nos, default=None)

                  lines.append("グランドノート")
                  lines.append("周回・順位\\t1\\t2\\t3\\t4\\t5\\t6\\t7\\t8")
                  for item in gn:
                      if not isinstance(item, dict):
                          continue
                      try:
                          lap_no = int(item.get("lapNo"))
                      except (TypeError, ValueError):
                          continue
                      ranks = item.get("rankList") or []
                      cars = []
                      for r in sorted(ranks, key=lambda x: int(x.get("rank") or 99) if isinstance(x, dict) else 99):
                          if not isinstance(r, dict):
                              continue
                          car = str(r.get("carNo") or "").strip()
                          if _valid_lap_car(car):
                              cars.append(car)
                      if not cars:
                          continue
                      label = "ゴール線" if max_lap is not None and lap_no == max_lap else f"{lap_no}周目"
                      lines.append(f"{label}\\t" + "\\t".join(cars))
          '''
          app_path.write_text(app[:start] + new_block + app[end:], encoding="utf-8")

          engine_path = Path("engine.py")
          engine = engine_path.read_text(encoding="utf-8")
          old_token = "([1-9])周目"
          new_token = "([1-9])周(?:目)?"
          if engine.count(old_token) != 1:
              raise SystemExit(f"Expected exactly one parser token, found {engine.count(old_token)}")
          engine_path.write_text(engine.replace(old_token, new_token, 1), encoding="utf-8")
          print("PATCHED: app.py converter + engine.py parser")
          PY

      - name: Add regression tests
        run: |
          cat > tests/test_v35_parse_laps_label_fix.py <<'PY'
          import ast
          import json
          import re
          from pathlib import Path

          import pandas as pd

          ROOT = Path(__file__).resolve().parents[1]
          FIXTURES = json.loads((ROOT / "tests/fixtures/laps_label_cases.json").read_text(encoding="utf-8"))

          def load_function(path, name, namespace):
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source)
              nodes = [
                  node for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name
              ]
              assert nodes, f"missing function {name} in {path}"
              code = ast.get_source_segment(source, nodes[-1])
              exec(compile(code, str(path), "exec"), namespace)
              return namespace[name]

          converter = load_function(ROOT / "app.py", "_v319_autorace_result_to_text", {"re": re})
          parser = load_function(ROOT / "engine.py", "_v35_parse_laps", {"re": re, "pd": pd})

          def get_lap_lines(text):
              return [
                  line for line in text.splitlines()
                  if line.startswith("ゴール線\t")
                  or (line.split("\t", 1)[0].endswith("周目") if "\t" in line else False)
              ]

          def test_four_captured_api_cases_have_one_finish_line_and_no_empty_cars():
              expected_counts = {
                  "hamamatsu_10r": 9,
                  "hamamatsu_12r_void": 7,
                  "kawaguchi_1r": 7,
                  "sanyo_8r": 7,
              }
              for case in FIXTURES:
                  text = converter(
                      {"raceResult": [], "grandNoteList": case["grandNoteList"], "refundInfo": {}},
                      "fixture", 1, "20261115"
                  )
                  lap_lines = get_lap_lines(text)
                  assert len(lap_lines) == expected_counts[case["name"]], case["name"]
                  assert sum(line.startswith("ゴール線\t") for line in lap_lines) == 1, case["name"]
                  assert all(line.split("\t")[1:] for line in lap_lines), case["name"]
                  assert all(
                      car in {"1", "2", "3", "4", "5", "6", "7", "8"}
                      for line in lap_lines for car in line.split("\t")[1:]
                  ), case["name"]
                  parsed = parser(text)
                  assert not parsed.empty, case["name"]
                  assert parsed["周回番号"].nunique() == expected_counts[case["name"]], case["name"]
                  assert (parsed["周回番号"] == 99).sum() > 0, case["name"]

          def test_void_case_uses_max_lap_with_valid_car_not_empty_notes():
              case = next(x for x in FIXTURES if x["name"] == "hamamatsu_12r_void")
              text = converter(
                  {"raceResult": [], "grandNoteList": case["grandNoteList"], "refundInfo": {}},
                  "浜松", 12, "20261102"
              )
              lap_lines = get_lap_lines(text)
              assert lap_lines[0].startswith("ゴール線\t4\t6\t7")
              assert len(lap_lines) == 7
              assert not any(line.startswith("8周") or line.startswith("9周") for line in lap_lines)

          def test_parser_accepts_legacy_and_new_lap_labels():
              text = "グランドノート\n6周\t1\t2\t3\n5周目\t3\t2\t1\n払戻金"
              parsed = parser(text)
              assert set(parsed["周回番号"].tolist()) == {5, 6}
              assert set(parsed["周回"].tolist()) == {"6周", "5周目"}
          PY

      - name: Run regression tests and syntax checks
        run: |
          python -m pytest -q tests/test_v35_parse_laps_label_fix.py
          python -m py_compile app.py engine.py

      - name: Commit tested fix on isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py engine.py tests/test_v35_parse_laps_label_fix.py tests/fixtures/laps_label_cases.json
          git commit -m "Fix result lap labels and finish-line detection"
          git push origin HEAD:qver-laps-label-fix
