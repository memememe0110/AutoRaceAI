name: Issue 31 Prediction History Duplicate Audit

on:
  push:
    branches:
      - tmp-audit-31-duplicates
    paths:
      - ".github/workflows/audit-31-duplicates.yml"
      - "tools/audit_prediction_history_duplicates.py"
      - "tests/test_prediction_history_duplicates.py"

permissions:
  contents: read

concurrency:
  group: issue-31-duplicate-audit
  cancel-in-progress: false

env:
  DB_REPO: memememe0110/AutoRaceAI
  DB_COMMIT_SHA: 20c67a8450ea72d219c19601319faf558a2f93c1
  EXPECTED_GENERATION: "705"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: |
          python -m py_compile \
            tools/audit_prediction_history_duplicates.py \
            tests/test_prediction_history_duplicates.py
      - name: Unit tests and collection-count gate
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys

          result = subprocess.run(
              [
                  sys.executable, "-m", "unittest", "discover",
                  "-s", "tests", "-t", ".",
                  "-p", "test_prediction_history_duplicates.py", "-v",
              ],
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          print(result.stdout, end="")
          if result.returncode:
              raise SystemExit(result.returncode)

          match = re.search(
              r"^Ran (\\d+) tests?\\b", result.stdout, re.MULTILINE
          )
          if not match or int(match.group(1)) < 5:
              raise SystemExit(
                  "TEST_COUNT_GATE_FAILED: "
                  f"{match.group(1) if match else 'Ran line missing'}"
              )
          print(f"TEST_COUNT_GATE_PASS: {match.group(1)}")
          PY

  audit:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch immutable DB snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work
          python tools/prospective_collector.py fetch-db \
            --repo "$DB_REPO" \
            --branch "$DB_COMMIT_SHA" \
            --out work/autorace_players.sqlite3 \
            --info-out work/db_info.json
      - name: Verify pinned generation and commit
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          info = json.loads(
              Path("work/db_info.json").read_text(encoding="utf-8")
          )
          expected_generation = os.environ["EXPECTED_GENERATION"]
          expected_sha = os.environ["DB_COMMIT_SHA"]

          if str(info.get("manifest_generation")) != expected_generation:
              raise SystemExit(f"GENERATION_MISMATCH: {info}")
          if info.get("commit_sha") != expected_sha:
              raise SystemExit(f"COMMIT_SHA_MISMATCH: {info}")
          if not info.get("db_sha256"):
              raise SystemExit(f"DB_SHA_MISSING: {info}")

          print(json.dumps(info, ensure_ascii=False, indent=2))
          PY
      - name: Run read-only duplicate audit
        run: |
          set -euo pipefail
          python tools/audit_prediction_history_duplicates.py \
            --db work/autorace_players.sqlite3 \
            --db-info work/db_info.json \
            --expected-generation "$EXPECTED_GENERATION" \
            --outdir work/duplicates
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: issue-31-duplicates-${{ github.run_id }}
          path: |
            work/duplicates/duplicates.csv
            work/duplicates/summary.json
          if-no-files-found: error
          retention-days: 30
