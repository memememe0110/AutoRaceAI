name: Temporary Lap Learning Impact Audit
run-name: "Lap learning audit ${{ github.run_id }}"

on:
  push:
    branches:
      - tmp-lap-learning-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine audit dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy pandas openpyxl
      - name: Fetch immutable DB snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p work
          python tools/prospective_collector.py fetch-db --repo "$REPO" --branch autorace-db --out work/autorace_players.sqlite3 --info-out work/db_info.json
      - name: Read-only lap learning audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, sqlite3
          from pathlib import Path

          db = Path("work/autorace_players.sqlite3").resolve()
          out = Path("work/lap_learning_audit")
          out.mkdir(parents=True, exist_ok=True)
          targets = [
              "20260723_伊勢崎_8R",
              "20260803_川口_6R",
              "20260805_飯塚_1R",
              "20260928_伊勢崎_8R",
              "20261004_飯塚_9R",
              "20261006_伊勢崎_6R",
              "20261007_川口_6R",
              "20261008_飯塚_12R",
              "20261009_山陽_5R",
              "20261009_飯塚_4R",
              "20261012_飯塚_12R",
              "20261025_伊勢崎_12R",
          ]
          with sqlite3.connect(f"file:{db.as_posix()}?mode=ro", uri=True) as con:
              con.execute("PRAGMA query_only=ON")
              integrity = con.execute("PRAGMA integrity_check").fetchone()[0]
              tables = {r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              required = {"player_lap_history", "result_laps", "result_entries"}
              missing = sorted(required - tables)
              if missing:
                  raise SystemExit("Missing tables: " + ", ".join(missing))
              schema = [dict(cid=r[0], name=r[1], type=r[2], notnull=r[3], default=r[4], pk=r[5])
                        for r in con.execute("PRAGMA table_info(player_lap_history)")]
              total_rows = con.execute("SELECT COUNT(*) FROM player_lap_history").fetchone()[0]
              distinct_players = con.execute("SELECT COUNT(DISTINCT player_name) FROM player_lap_history").fetchone()[0]
              distinct_races = con.execute("SELECT COUNT(DISTINCT race_key) FROM player_lap_history").fetchone()[0]
              target_sql = ",".join(["(?)"] * len(targets))
              params = tuple(targets)
              race_rows = con.execute(f"""
                WITH targets(race_key) AS (VALUES {target_sql})
                SELECT t.race_key,
                       COUNT(DISTINCT e.car_no) AS entry_cars,
                       COUNT(DISTINCT CASE WHEN TRIM(COALESCE(e.player_name,''))<>'' THEN e.player_name END) AS named_players,
                       COUNT(DISTINCT l.rowid) AS result_lap_rows,
                       COUNT(DISTINCT h.rowid) AS linked_history_rows
                  FROM targets t
                  LEFT JOIN result_entries e ON e.race_key=t.race_key
                  LEFT JOIN result_laps l ON l.race_key=t.race_key
                  LEFT JOIN player_lap_history h ON h.race_key=t.race_key
                 GROUP BY t.race_key ORDER BY t.race_key
              """, params).fetchall()
              players = con.execute(f"""
                WITH targets(race_key) AS (VALUES {target_sql}),
                target_players AS (
                  SELECT REPLACE(REPLACE(TRIM(e.player_name),' ',''),'　','') AS name_key,
                         MIN(TRIM(e.player_name)) AS player_name
                    FROM result_entries e JOIN targets t ON t.race_key=e.race_key
                   WHERE TRIM(COALESCE(e.player_name,''))<>''
                   GROUP BY REPLACE(REPLACE(TRIM(e.player_name),' ',''),'　','')
                ),
                lap_by_race AS (
                  SELECT REPLACE(REPLACE(TRIM(player_name),' ',''),'　','') AS name_key,
                         race_key, COUNT(*) AS history_rows,
                         MAX(CASE WHEN lap_label='1周目' AND position IS NOT NULL THEN 1 ELSE 0 END) AS has_first,
                         MAX(CASE WHEN lap_label IN ('ゴール線','ゴール') AND position IS NOT NULL THEN 1 ELSE 0 END) AS has_goal
                    FROM player_lap_history
                   GROUP BY REPLACE(REPLACE(TRIM(player_name),' ',''),'　',''), race_key
                ),
                history_summary AS (
                  SELECT name_key, SUM(history_rows) AS history_rows,
                         COUNT(*) AS history_races,
                         SUM(CASE WHEN has_first=1 AND has_goal=1 THEN 1 ELSE 0 END) AS eligible_lap_races,
                         MIN(race_key) AS oldest_race_key, MAX(race_key) AS newest_race_key
                    FROM lap_by_race GROUP BY name_key
                )
                SELECT p.player_name,
                       COALESCE(h.history_rows,0) AS history_rows,
                       COALESCE(h.history_races,0) AS history_races,
                       COALESCE(h.eligible_lap_races,0) AS eligible_lap_races,
                       h.oldest_race_key, h.newest_race_key
                  FROM target_players p
                  LEFT JOIN history_summary h ON h.name_key=p.name_key
                 ORDER BY eligible_lap_races ASC, history_races ASC, history_rows ASC, p.player_name
              """, params).fetchall()
              result_laps_total = con.execute("SELECT COUNT(*) FROM result_laps").fetchone()[0]
              unsynced_lap_rows = con.execute("""
                SELECT COUNT(*)
                  FROM result_laps rl
                  JOIN result_entries re ON re.race_key=rl.race_key AND re.car_no=rl.car_no
                  LEFT JOIN player_lap_history plh
                    ON plh.race_key=rl.race_key AND plh.car_no=rl.car_no
                   AND plh.lap_label=rl.lap_label
                 WHERE plh.race_key IS NULL
                   AND COALESCE(TRIM(re.player_name),'')<>''
              """).fetchone()[0]
              global_summary = {
                "integrity_check": integrity,
                "player_lap_history_rows": total_rows,
                "distinct_players": distinct_players,
                "distinct_races": distinct_races,
                "result_laps_total_rows": result_laps_total,
                "unsynced_result_lap_rows_estimate": unsynced_lap_rows,
                "target_race_count": len(targets),
                "target_player_count": len(players),
                "target_races_with_entries": sum(1 for r in race_rows if r[1] > 0),
                "target_players_with_zero_history": sum(1 for r in players if r[2] == 0),
                "target_players_with_zero_eligible_lap_history": sum(1 for r in players if r[3] == 0),
                "target_players_with_1_to_7_eligible_lap_races": sum(1 for r in players if 1 <= r[3] <= 7),
                "target_players_with_8plus_eligible_lap_races": sum(1 for r in players if r[3] >= 8),
                "database_modified": False
              }
          def write_csv(name, header, rows):
              with (out / name).open("w", newline="", encoding="utf-8-sig") as f:
                  w = csv.writer(f); w.writerow(header); w.writerows(rows)
          write_csv("target_races.csv",
                    ["race_key","entry_cars","named_players","result_lap_rows","linked_history_rows"], race_rows)
          write_csv("target_players_history.csv",
                    ["player_name","history_rows","history_races","eligible_lap_races","oldest_race_key","newest_race_key"], players)
          (out / "player_lap_history_schema.json").write_text(
              json.dumps({"schema": schema, "summary": global_summary}, ensure_ascii=False, indent=2),
              encoding="utf-8")
          info = json.loads(Path("work/db_info.json").read_text(encoding="utf-8"))
          report = {"db_info": info, "summary": global_summary, "schema": schema,
                    "target_races": [dict(zip(["race_key","entry_cars","named_players","result_lap_rows","linked_history_rows"], r)) for r in race_rows],
                    "target_players": [dict(zip(["player_name","history_rows","history_races","eligible_lap_races","oldest_race_key","newest_race_key"], r)) for r in players]}
          (out / "lap_learning_audit_summary.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(global_summary, ensure_ascii=False))
          PY
      - name: Isolated v62 rebuild and Ver60 sample comparison
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, shutil, sqlite3, sys
          from pathlib import Path
          import pandas as pd

          root = Path.cwd()
          source = (root / "work/autorace_players.sqlite3").resolve()
          isolated = (root / "work/autorace_players_isolated.sqlite3").resolve()
          shutil.copy2(source, isolated)
          original_sha_before = hashlib.sha256(source.read_bytes()).hexdigest()

          targets = [
              "20260723_伊勢崎_8R", "20260803_川口_6R", "20260805_飯塚_1R",
              "20260928_伊勢崎_8R", "20261004_飯塚_9R", "20261006_伊勢崎_6R",
              "20261007_川口_6R", "20261008_飯塚_12R", "20261009_山陽_5R",
              "20261009_飯塚_4R", "20261012_飯塚_12R", "20261025_伊勢崎_12R",
          ]
          with sqlite3.connect(f"file:{source.as_posix()}?mode=ro", uri=True) as con:
              sql = ",".join(["(?)"] * len(targets))
              rows = con.execute(f"""
                WITH targets(race_key) AS (VALUES {sql})
                SELECT REPLACE(REPLACE(TRIM(e.player_name),' ',''),'　','') AS name_key,
                       MIN(TRIM(e.player_name)) AS player_name
                  FROM result_entries e JOIN targets t ON t.race_key=e.race_key
                 WHERE TRIM(COALESCE(e.player_name,''))<>''
                 GROUP BY REPLACE(REPLACE(TRIM(e.player_name),' ',''),'　','')
                 ORDER BY name_key
              """, tuple(targets)).fetchall()
              names = [r[1] for r in rows]
              before_rows = con.execute("SELECT COUNT(*) FROM player_lap_history").fetchone()[0]

          sys.path.insert(0, str(root))
          import engine
          meta = {"開催日": "2026-11-16", "レース": "12R", "走路温度": 30}
          engine.v61_set_learning_boundary(meta)
          frame = pd.DataFrame({"選手名": names})
          before = engine.v60_apply_lap_and_heat_learning(
              frame, entries=None, meta=meta, db_path=str(isolated)
          )
          before_map = before.set_index("選手名").to_dict(orient="index")
          before_counts = pd.to_numeric(before["展開履歴件数"], errors="coerce").fillna(0)
          before_distribution = {
              "zero": int((before_counts == 0).sum()),
              "one_to_seven": int(((before_counts >= 1) & (before_counts <= 7)).sum()),
              "eight_plus": int((before_counts >= 8).sum()),
          }
          sample_names = before.assign(_n=before_counts).sort_values(
              ["_n", "選手名"], ascending=[True, True]
          )["選手名"].head(2).tolist()

          rebuild_stats = engine.v62_rebuild_grand_note_learning(str(isolated))
          engine.v61_set_learning_boundary(meta)
          after = engine.v60_apply_lap_and_heat_learning(
              frame, entries=None, meta=meta, db_path=str(isolated)
          )
          after_map = after.set_index("選手名").to_dict(orient="index")
          after_counts = pd.to_numeric(after["展開履歴件数"], errors="coerce").fillna(0)
          after_distribution = {
              "zero": int((after_counts == 0).sum()),
              "one_to_seven": int(((after_counts >= 1) & (after_counts <= 7)).sum()),
              "eight_plus": int((after_counts >= 8).sum()),
          }
          with sqlite3.connect(f"file:{isolated.as_posix()}?mode=ro", uri=True) as con:
              after_rows = con.execute("SELECT COUNT(*) FROM player_lap_history").fetchone()[0]
              remaining_unsynced = con.execute("""
                SELECT COUNT(*) FROM result_laps rl
                JOIN result_entries re ON re.race_key=rl.race_key AND re.car_no=rl.car_no
                LEFT JOIN player_lap_history plh
                  ON plh.race_key=rl.race_key AND plh.car_no=rl.car_no
                 AND plh.lap_label=rl.lap_label
                WHERE plh.race_key IS NULL AND COALESCE(TRIM(re.player_name),'')<>''
              """).fetchone()[0]
          original_sha_after = hashlib.sha256(source.read_bytes()).hexdigest()

          fields = ["展開履歴件数","初周主導指数","位置維持指数","捌き指数",
                    "追込み指数","終盤指数_実測","失速リスク","展開学習補正","Ver60総合補正"]
          samples = []
          for name in sample_names:
              b = before_map.get(name, {})
              a = after_map.get(name, {})
              samples.append({
                  "player_name": name,
                  "before": {k: (None if pd.isna(b.get(k)) else float(b.get(k))) for k in fields},
                  "after": {k: (None if pd.isna(a.get(k)) else float(a.get(k))) for k in fields},
                  "delta": {
                      k: (None if pd.isna(b.get(k)) or pd.isna(a.get(k))
                          else float(a.get(k)) - float(b.get(k)))
                      for k in fields
                  }
              })
          report = {
              "database_generation": 704,
              "source_db_sha256_before": original_sha_before,
              "source_db_sha256_after": original_sha_after,
              "source_db_unchanged": original_sha_before == original_sha_after,
              "target_player_count": len(names),
              "player_lap_history_rows_before": before_rows,
              "player_lap_history_rows_after": after_rows,
              "player_lap_history_rows_delta": after_rows - before_rows,
              "v62_rebuild_stats": rebuild_stats,
              "remaining_unsynced_lap_rows_estimate": remaining_unsynced,
              "ver60_history_count_distribution_before": before_distribution,
              "ver60_history_count_distribution_after": after_distribution,
              "sample_players": samples,
              "isolated_copy_only": True
          }
          out = root / "work/lap_learning_audit"
          (out / "isolated_v62_ver60_comparison.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False))
          if original_sha_before != original_sha_after:
              raise SystemExit("Source DB changed unexpectedly")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lap-learning-audit-${{ github.run_id }}
          path: work/lap_learning_audit/*
          if-no-files-found: error
          retention-days: 30
