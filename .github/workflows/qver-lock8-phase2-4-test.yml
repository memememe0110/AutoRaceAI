name: QVer Lock8 Phase2-4 Tests

on:
  push:
    branches:
      - qver-lock8-heartbeat-fix
    paths:
      - "app.py"
      - "engine.py"
      - "tests/test_queue_version_lock_phase2.py"
      - "tests/test_queue_version_lock_phase3.py"
      - "tests/test_queue_version_lock_phase4.py"
      - "tests/test_queue_version_lock_integration.py"
      - "tests/qver_realcode.py"
      - "tests/qver_lock8_review_test.py"
      - ".github/workflows/qver-lock8-phase2-4-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qver-lock8-phase2-4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase2-4:
    name: Phase 2-4 and real-code integration regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: qver-lock8-heartbeat-fix

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install real-code test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas openpyxl

      - name: Compile test targets
        run: |
          python -m py_compile app.py engine.py tests/qver_realcode.py tests/qver_lock8_review_test.py tests/test_queue_version_lock_phase2.py tests/test_queue_version_lock_phase3.py tests/test_queue_version_lock_phase4.py tests/test_queue_version_lock_integration.py

      - name: Run Phase 2 Queue tests
        run: python tests/test_queue_version_lock_phase2.py

      - name: Run Phase 3 Worker concurrency tests
        run: python tests/test_queue_version_lock_phase3.py

      - name: Run Phase 4 fingerprint and history tests
        run: python tests/test_queue_version_lock_phase4.py

      - name: Run actual app.py and engine.py integration tests
        run: python tests/test_queue_version_lock_integration.py
