name: Real lap count simulation tests

on:
  push:
    branches:
      - fix/real-lap-count-simulation
    paths:
      - "app.py"
      - "engine.py"
      - "tests/test_real_lap_count_simulation.py"
      - ".github/workflows/real-lap-count-pytest.yml"
  pull_request:
    paths:
      - "app.py"
      - "engine.py"
      - "tests/test_real_lap_count_simulation.py"
      - ".github/workflows/real-lap-count-pytest.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest numpy pandas openpyxl
      - run: pytest -q tests/test_real_lap_count_simulation.py
