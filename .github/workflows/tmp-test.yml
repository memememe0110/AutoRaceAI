name: TMP test fingerprint input sha

on:
  push:
    branches:
      - tmp-test-fingerprint-sha
    paths:
      - ".github/workflows/tmp-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: qver-fingerprint-input-sha-required
          path: pr-code
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy openpyxl

      - name: Run fingerprint pytest suite
        working-directory: pr-code
        env:
          PYTHONPATH: tests
        run: |
          set -euo pipefail
          python -m pytest -v \
            tests/test_fingerprint_input_sha.py \
            tests/test_prediction_fingerprint_reuse.py

      - name: Run queue and P5 regression harness
        working-directory: pr-code
        env:
          PYTHONPATH: tests
        run: |
          set -euo pipefail
          python tests/test_queue_done_defer.py | tee queue-regression.log
          grep -Fq -- "--- summary: PASS=10 FAIL=0 SKIP=0 ---" queue-regression.log
          ! grep -Eq '(^| )FAIL( |$)' queue-regression.log
