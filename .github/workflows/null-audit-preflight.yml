name: NULL Audit Preflight
on:
  push:
    branches:
      - qver-audit-null-columns
    paths:
      - ".github/workflows/null-audit-preflight.yml"
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: qver-audit-null-columns
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch immutable DB snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p work
          python tools/prospective_collector.py fetch-db \
            --repo "$REPO" \
            --branch autorace-db \
            --out work/autorace_players.sqlite3 \
            --info-out work/db_info.json
      - name: Inspect NULL audit preflight schema and samples (read-only)
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path

          db = Path("work/autorace_players.sqlite3").resolve()
          con = sqlite3.connect(f"file:{db.as_posix()}?mode=ro", uri=True)
          con.execute("PRAGMA query_only=ON")
          tables = {r[0] for r in con.execute(
              "SELECT name FROM sqlite_master WHERE type='table'"
          )}
          print("DB_INFO", Path("work/db_info.json").read_text(encoding="utf-8"))
          for table in ("result_races", "result_entries", "result_laps", "races"):
              if table not in tables:
                  print("TABLE_ABSENT", table)
                  continue
              cols = con.execute(f"PRAGMA table_info({table})").fetchall()
              print("PRAGMA_TABLE_INFO_" + table, json.dumps(
                  [{"name":r[1], "type":r[2]} for r in cols],
                  ensure_ascii=False
              ))
              print("ROW_COUNT_" + table, con.execute(
                  f"SELECT COUNT(*) FROM {table}"
              ).fetchone()[0])
          if "result_races" in tables:
              cols = {r[1] for r in con.execute("PRAGMA table_info(result_races)")}
              if "registered_at" in cols:
                  print("REGISTERED_AT_SAMPLE", json.dumps(
                      con.execute(
                          "SELECT registered_at FROM result_races "
                          "WHERE registered_at IS NOT NULL LIMIT 5"
                      ).fetchall(), ensure_ascii=False
                  ))
                  print("REGISTERED_AT_FORMAT_COUNTS", json.dumps(
                      con.execute(
                          "SELECT CASE "
                          "WHEN registered_at LIKE '%+__:__' THEN 'iso_offset_colon' "
                          "WHEN registered_at LIKE '%+____' THEN 'offset_no_colon' "
                          "WHEN registered_at LIKE '%Z' THEN 'utc_z' "
                          "WHEN registered_at LIKE '____-__-__ __:__:__' THEN 'sqlite_datetime' "
                          "ELSE 'other_or_null' END, COUNT(*) "
                          "FROM result_races GROUP BY 1"
                      ).fetchall(), ensure_ascii=False
                  ))
          con.close()
          PY
